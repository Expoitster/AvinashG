<title>Avinash Garudapalli</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;450;500;600&display=swap">

<!-- GSAP drives the scroll-linked motion. Pinned to an exact version: this is
     loaded as a plain script, not bundled, so there is nothing to lock a range
     for us. scripts/build-site.mjs rewrites these two URLs to vendored copies
     under docs/vendor/ in the built page, so the deployed site and the offline
     QA harness never depend on a network fetch. The CDN URLs are what the
     Claude Artifact host sees, where the source is previewed as a fragment. -->
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/ScrollTrigger.min.js"></script>

<style>
  :root {
    --ground: #FAF8F3;
    --ground-2: #F1EDE4;
    --panel: #FFFFFF;
    --panel-2: #F6F2E9;
    --rule: #E5DFD2;
    --rule-2: #CDC4B2;
    --paper: #1A2230;
    --dim: #55606E;
    --dim-2: #5C6573;
    --signal: #97590A;
    --signal-deep: #E0B978;
    --data: #0E6E7B;
    --data-deep: #9FD0D6;
    --good: #2C7A50;

    --f-display: "Sora", "Segoe UI", system-ui, sans-serif;
    --f-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
    /* mono is reserved for measured values — never for decorative labels */
    --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;

    --topbar-h: 64px;
    --statusbar-h: 0px;
    --measure: 62ch;

    /* editorial rhythm */
    --sec-y: clamp(90px, 13vh, 160px);

    /* ---- Material 3 system tokens ----
       Motion, elevation and shape follow Material's scales so every surface
       reacts the same way. The typography and palette stay bespoke: Material
       is applied as the interaction system, not as a skin. */
    --md-ease: cubic-bezier(.2, 0, 0, 1);          /* emphasised decelerate */
    --md-ease-accel: cubic-bezier(.3, 0, .8, .15); /* emphasised accelerate */
    --md-short: 200ms;
    --md-medium: 350ms;
    --md-long: 500ms;

    /* elevation: ambient + key light, per Material's two-shadow model */
    --md-e1: 0 1px 2px rgba(46,58,80,.10), 0 1px 3px 1px rgba(46,58,80,.07);
    --md-e2: 0 1px 2px rgba(46,58,80,.10), 0 2px 6px 2px rgba(46,58,80,.07);
    --md-e3: 0 4px 8px 3px rgba(46,58,80,.08), 0 1px 3px rgba(46,58,80,.12);

    /* shape scale */
    --md-r-xs: 4px;
    --md-r-s: 8px;
    --md-r-m: 12px;
    --md-r-l: 16px;

    /* state layer opacities */
    --md-hover: .08;
    --md-focus: .10;
    --md-press: .10;

    /* Material's minimum touch target */
    --md-target: 48px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--ground);
    color: var(--paper);
    font-family: var(--f-body);
    font-size: 16px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    padding-bottom: var(--statusbar-h);
    overflow-x: hidden;
  }
  body.menu-open { overflow: hidden; }

  /* ---------- backdrop: faint measurement grid ---------- */
  .backdrop {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    background-image:
      linear-gradient(to right, rgba(90,104,128,.14) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(90,104,128,.09) 1px, transparent 1px);
    background-size: 64px 64px;
    mask-image: radial-gradient(ellipse 120% 80% at 50% 0%, #000 20%, transparent 78%);
  }

  /* ---------- top bar ---------- */
  .topbar {
    position: sticky;
    top: 0;
    z-index: 40;
    height: var(--topbar-h);
    display: flex;
    align-items: center;
    gap: 24px;
    padding: 0 20px;
    background: rgba(250,248,243,.88);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--rule);
    box-shadow: var(--md-e1);
  }

  .mark {
    font-family: var(--f-display);
    font-weight: 700;
    font-size: 1rem;
    letter-spacing: .04em;
    color: var(--paper);
    text-decoration: none;
    display: flex;
    align-items: center;
    gap: 9px;
    white-space: nowrap;
    min-height: 44px; /* touch target, not visual height */
  }
  .mark .dot {
    width: 7px; height: 7px;
    background: var(--signal);
    border-radius: 50%;
    box-shadow: 0 0 0 3px rgba(151,89,10,.14);
    animation: pulse 2.6s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { opacity:1 } 50% { opacity:.35 } }

  .nav { display: flex; gap: 2px; margin-left: auto; }
  .nav a {
    font-family: var(--f-body);
    font-size: .875rem;
    font-weight: 450;
    color: var(--dim);
    text-decoration: none;
    padding: 7px 11px;
    border: 1px solid transparent;
    transition: color .16s, border-color .16s;
  }
  .nav a:hover { color: var(--paper); border-color: var(--rule); }
  .nav a[aria-current="page"] { color: var(--signal); border-color: var(--signal-deep); }

  .cta-top {
    display: inline-flex;
    align-items: center;
    min-height: 44px;
    font-family: var(--f-mono);
    font-size: .74rem;
    text-transform: uppercase;
    letter-spacing: .04em;
    color: var(--signal);
    text-decoration: none;
    border: 1px solid var(--signal-deep);
    background: rgba(151,89,10,.09);
    padding: 8px 13px;
    white-space: nowrap;
    transition: background-color .16s, border-color .16s;
  }
  .cta-top:hover { background: rgba(151,89,10,.16); border-color: var(--signal); }

  /* ---------- menu drawer (all sizes) ---------- */
  .nav-toggle {
    display: inline-flex;
    align-items: center;
    gap: 9px;
    min-height: 40px;
    padding: 8px 12px;
    font-family: var(--f-mono);
    font-size: .75rem;
    color: var(--paper);
    background: var(--panel);
    border: 1px solid var(--rule);
    cursor: pointer;
    transition: border-color .16s;
  }
  .nav-toggle:hover { border-color: var(--signal); }
  .bars { display: inline-grid; gap: 3px; width: 15px; }
  .bars i { display: block; height: 1.5px; background: currentColor; }
  .bars i:nth-child(2) { width: 70%; }

  .drawer-scrim {
    position: fixed;
    inset: 0;
    z-index: 64;
    background: rgba(6, 10, 16, .72);
    backdrop-filter: blur(2px);
  }
  .drawer-scrim[hidden] { display: none; }

  .drawer {
    position: fixed;
    top: 0; right: 0; bottom: 0;
    z-index: 65;
    width: min(400px, 88vw);
    display: flex;
    flex-direction: column;
    background: var(--ground-2);
    border-left: 1px solid var(--rule-2);
    transform: translateX(102%);
    transition: transform .42s cubic-bezier(.16, 1, .3, 1);
    padding-bottom: env(safe-area-inset-bottom, 0);
  }
  .drawer.open { transform: translateX(0); }
  .drawer[aria-hidden="true"] { visibility: hidden; }
  .drawer.open[aria-hidden="false"] { visibility: visible; }

  .drawer-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 18px;
    border-bottom: 1px solid var(--rule);
  }
  .drawer-title { font-family: var(--f-mono); font-size: .76rem; color: var(--dim-2); letter-spacing: .05em; }
  .drawer-close {
    width: 40px; height: 40px;
    display: grid; place-items: center;
    background: transparent;
    border: 1px solid var(--rule);
    color: var(--paper);
    font-size: .95rem;
    cursor: pointer;
  }
  .drawer-close:hover { border-color: var(--signal); color: var(--signal); }

  .drawer-body { flex: 1; overflow-y: auto; padding: 6px 0 14px; -webkit-overflow-scrolling: touch; }
  .drawer-group { padding: 14px 18px 4px; }
  .drawer-group-name {
    font-family: var(--f-mono);
    font-size: .68rem;
    letter-spacing: .09em;
    color: var(--dim-2);
    padding-bottom: 8px;
  }
  .drawer-link {
    display: block;
    padding: 12px 18px;
    min-height: 52px;
    text-decoration: none;
    color: var(--paper);
    border-left: 2px solid transparent;
    transition: background-color .16s, border-color .16s;
  }
  .drawer-link:hover { background: var(--panel); border-left-color: var(--rule-2); }
  .drawer-link[aria-current="page"] { border-left-color: var(--signal); background: rgba(255,176,58,.07); }
  .drawer-link[aria-current="page"] .dl-name { color: var(--signal); }
  .dl-name { display: block; font-size: .97rem; font-weight: 500; }
  .dl-note { display: block; font-size: .8rem; color: var(--dim-2); margin-top: 3px; line-height: 1.4; }

  .drawer-cta {
    display: block;
    margin: 0 18px 18px;
    padding: 14px;
    text-align: center;
    font-family: var(--f-mono);
    font-size: .78rem;
    text-transform: uppercase;
    letter-spacing: .05em;
    text-decoration: none;
    color: var(--signal);
    border: 1px solid var(--signal-deep);
    background: rgba(151,89,10,.09);
  }
  .drawer-cta:hover { background: rgba(151,89,10,.16); }

  /* ---------- layout ---------- */
  .wrap {
    position: relative;
    z-index: 1;
    max-width: 1080px;
    margin: 0 auto;
    padding: 0 20px;
    /* the intro scales this column up out of the monitor screen */
    transform-origin: 0 0;
  }

  section { padding: var(--sec-y) 0; scroll-margin-top: calc(var(--topbar-h) + 20px); }
  section + section { border-top: 1px solid var(--rule); }

  h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; }

  h1 {
    font-size: clamp(2.2rem, 5vw, 3.6rem);
    font-weight: 600;
    line-height: 1.08;
    letter-spacing: -.03em;
  }
  h2 {
    font-size: clamp(1.7rem, 3.6vw, 2.5rem);
    font-weight: 600;
    line-height: 1.14;
    letter-spacing: -.025em;
  }
  h3 { font-size: 1.15rem; font-weight: 600; line-height: 1.3; letter-spacing: -.01em; }

  p { margin: 0; max-width: var(--measure); }
  .lede {
    font-size: clamp(1.05rem, 1.5vw, 1.2rem);
    color: var(--dim);
    line-height: 1.66;
    font-weight: 300;
  }

  /* Section head: a number and a rule. The number is real — sections are an
     ordered narrative, so the sequence carries meaning. */
  .sec-head { margin-bottom: clamp(32px, 5vh, 56px); max-width: 46ch; }
  .sec-head .idx {
    display: block;
    font-family: var(--f-body);
    font-size: .78rem;
    font-weight: 500;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--signal);
    margin-bottom: 18px;
  }
  .sec-head p { margin-top: 18px; color: var(--dim); font-size: 1.02rem; font-weight: 300; line-height: 1.62; }

  a { color: var(--data); }
  a:focus-visible, button:focus-visible, summary:focus-visible, input:focus-visible, canvas:focus-visible {
    outline: 2px solid var(--signal);
    outline-offset: 2px;
  }

  .num { font-variant-numeric: tabular-nums; }

  /* ---------- panel: instrument chrome ---------- */
  .panel {
    position: relative;
    background: var(--panel);
    border: 1px solid var(--rule);
    padding: 26px;
  }
  .panel-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    padding-bottom: 14px;
    margin-bottom: 20px;
    border-bottom: 1px solid var(--rule);
  }
  .panel-title { font-family: var(--f-display); font-weight: 600; font-size: 1rem; letter-spacing: .01em; }
  .panel-note { font-family: var(--f-mono); font-size: .72rem; color: var(--dim-2); line-height: 1.5; }

  /* ---------- hero ---------- */
  .hero { padding-top: 34px; padding-bottom: 56px; }
  .hero h1 { max-width: 21ch; }
  .hero .lede { margin-top: 16px; }
  .hero-meta {
    margin-top: 18px;
    display: flex;
    gap: 10px 26px;
    flex-wrap: wrap;
    font-family: var(--f-mono);
    font-size: .8rem;
    color: var(--dim-2);
  }
  .hero-meta span b { color: var(--dim); font-weight: 400; }

  /* ---------- latency lab ---------- */
  .lab { margin-top: 30px; }

  .budget {
    display: flex;
    height: 54px;
    border: 1px solid var(--rule-2);
    overflow: hidden;
    background: var(--ground-2);
  }
  .seg {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    min-width: 0;
    border-right: 1px solid rgba(250,248,243,.85);
    transition: flex-grow .55s cubic-bezier(.22,1,.36,1), background-color .3s;
    overflow: hidden;
  }
  .seg:last-child { border-right: 0; }
  .seg span {
    font-family: var(--f-mono);
    font-size: .68rem;
    color: rgba(16,23,34,.86);
    font-weight: 600;
    white-space: nowrap;
    padding: 0 4px;
  }
  .seg.s-net { background: #C7D0DD; }
  .seg.s-vad { background: #B6D7DA; }
  .seg.s-stt { background: #9CCFD8; }
  .seg.s-llm { background: #F0C98D; }
  .seg.s-tts { background: #E7B07C; }
  .seg.s-out { background: #D3C4AC; }

  .budget-legend {
    display: none;
    grid-template-columns: 1fr 1fr;
    gap: 7px 14px;
    margin-top: 14px;
  }
  .budget-legend div { display: flex; align-items: center; gap: 8px; font-family: var(--f-mono); font-size: .72rem; color: var(--dim); }
  .budget-legend i { width: 10px; height: 10px; flex: none; }
  .budget-legend i.s-net { background: #C7D0DD; }
  .budget-legend i.s-vad { background: #B6D7DA; }
  .budget-legend i.s-stt { background: #9CCFD8; }
  .budget-legend i.s-llm { background: #F0C98D; }
  .budget-legend i.s-tts { background: #E7B07C; }
  .budget-legend i.s-out { background: #D3C4AC; }

  .track {
    position: relative;
    height: 20px;
    margin-top: 2px;
    border-left: 1px solid var(--rule);
    border-right: 1px solid var(--rule);
  }
  .packet {
    position: absolute;
    top: 5px;
    left: 0;
    width: 9px; height: 9px;
    background: var(--signal);
    border-radius: 50%;
    box-shadow: 0 0 10px 2px rgba(151,89,10,.46);
    animation: travel var(--dur, 3s) linear infinite;
  }
  @keyframes travel {
    0%   { left: 0; opacity: 0; }
    6%   { opacity: 1; }
    94%  { opacity: 1; }
    100% { left: calc(100% - 9px); opacity: 0; }
  }
  .lab.paused .packet { animation-play-state: paused; }

  .lab-readout {
    display: flex;
    align-items: flex-end;
    gap: 30px;
    flex-wrap: wrap;
    margin-top: 24px;
    padding-top: 20px;
    border-top: 1px solid var(--rule);
  }
  .readout-big {
    font-family: var(--f-display);
    font-weight: 700;
    font-size: clamp(2.4rem, 6vw, 3.6rem);
    line-height: .95;
    color: var(--signal);
    letter-spacing: -.02em;
  }
  .readout-big .unit { font-size: .38em; color: var(--dim); margin-left: 6px; letter-spacing: 0; }
  .readout-label { font-size: .85rem; color: var(--dim); margin-top: 8px; max-width: 34ch; }
  .verdict {
    font-family: var(--f-mono);
    font-size: .78rem;
    padding: 8px 12px;
    border: 1px solid var(--rule);
    color: var(--dim);
    background: var(--ground-2);
    line-height: 1.45;
    max-width: 40ch;
  }
  .verdict.hit { border-color: var(--good); color: var(--good); }

  .toggles {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(216px, 1fr));
    gap: 10px;
    margin-top: 24px;
  }
  .tg {
    display: flex;
    align-items: flex-start;
    gap: 11px;
    padding: 13px 14px;
    background: var(--ground-2);
    border: 1px solid var(--rule);
    cursor: pointer;
    text-align: left;
    font: inherit;
    color: var(--dim);
    transition: border-color .16s, color .16s, background-color .16s;
  }
  .tg:hover { border-color: var(--rule-2); color: var(--paper); }
  .tg[aria-pressed="true"] { border-color: var(--signal-deep); background: rgba(151,89,10,.07); color: var(--paper); }
  .tg .led {
    flex: none;
    width: 9px; height: 9px;
    margin-top: 6px;
    border-radius: 50%;
    background: var(--rule-2);
    transition: background-color .2s, box-shadow .2s;
  }
  .tg[aria-pressed="true"] .led { background: var(--signal); box-shadow: 0 0 8px 1px rgba(151,89,10,.5); }
  .tg .tg-name { display: block; font-size: .9rem; font-weight: 500; line-height: 1.3; }
  .tg .tg-delta { display: block; font-family: var(--f-mono); font-size: .74rem; color: var(--dim-2); margin-top: 3px; }
  .tg[aria-pressed="true"] .tg-delta { color: var(--signal); }

  .lab-controls { display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
  .btn-ghost {
    font-family: var(--f-mono);
    font-size: .76rem;
    color: var(--dim);
    background: transparent;
    border: 1px solid var(--rule);
    padding: 8px 13px;
    cursor: pointer;
    transition: color .16s, border-color .16s;
  }
  .btn-ghost:hover { color: var(--paper); border-color: var(--rule-2); }

  /* ---------- readouts (impact) ---------- */
  .readouts { display: grid; grid-template-columns: repeat(auto-fit, minmax(232px, 1fr)); gap: 1px; background: var(--rule); border: 1px solid var(--rule); }
  .ro { background: var(--ground); padding: 22px 20px; }
  .ro .v {
    font-family: var(--f-display);
    font-weight: 700;
    font-size: 2.1rem;
    line-height: 1;
    letter-spacing: -.02em;
    color: var(--data);
  }
  .ro .k { font-size: .92rem; font-weight: 500; margin-top: 10px; }
  .ro .d { font-size: .82rem; color: var(--dim-2); margin-top: 6px; line-height: 1.5; }

  /* ---------- capability map ----------
     Real DOM elements so it reflows at any width; the connector wires are a
     progressive enhancement drawn from measured positions on wide screens. */
  .sysmap-shell { border: 1px solid var(--rule); background: var(--ground-2); }

  .sysmap {
    position: relative;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0 84px;
    padding: 20px;
  }
  .sysmap-wires {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    overflow: visible;
    pointer-events: none;
    z-index: 0;
  }
  .sysmap-wires .wire {
    fill: none;
    stroke: #CDC4B2;
    stroke-width: 1.2;
    opacity: .5;
    transition: stroke .2s, opacity .2s, stroke-width .2s;
  }
  .sysmap-wires .wire.on { stroke: var(--signal); stroke-width: 2; opacity: 1; }
  .sysmap.picking .wire:not(.on) { opacity: .07; }

  .sys-col { position: relative; z-index: 1; min-width: 0; }
  .sys-col-head {
    font-family: var(--f-body);
    font-size: .82rem;
    font-weight: 500;
    color: var(--dim-2);
    margin-bottom: 14px;
  }
  .sys-list { display: grid; gap: 10px; }

  .sysnode {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 12px;
    align-items: center;
    width: 100%;
    min-height: 58px;
    text-align: left;
    font: inherit;
    color: var(--paper);
    background: #EEE9DF;
    border: 1px solid #A4B0C2;
    padding: 11px 14px;
    cursor: pointer;
    touch-action: manipulation;
    user-select: none;
    transition: border-color .2s, background-color .2s;
  }
  .sysnode:hover { border-color: var(--signal); }
  .sysnode[aria-pressed="true"] { border-color: var(--signal); background: rgba(255,176,58,.1); }
  .sysnode-name { display: block; font-family: var(--f-display); font-weight: 600; font-size: 1rem; line-height: 1.2; }
  .sysnode-sub { display: block; font-family: var(--f-mono); font-size: .7rem; color: var(--dim-2); margin-top: 3px; }
  .sysnode-n {
    font-family: var(--f-mono);
    font-size: .72rem;
    color: var(--dim-2);
    border: 1px solid var(--rule);
    padding: 3px 7px;
    white-space: nowrap;
  }
  .sysnode[aria-pressed="true"] .sysnode-n { color: var(--signal); border-color: var(--signal-deep); }

  .syscap {
    display: flex;
    align-items: center;
    min-height: 52px;
    border: 1px solid #D5CEBE;
    background: #EEE9DF;
    color: var(--dim);
    font-size: .93rem;
    padding: 10px 14px;
    transition: border-color .2s, color .2s, background-color .2s;
  }
  .syscap.on { border-color: var(--data); color: var(--data); background: rgba(111,227,242,.08); }

  .sysmap-foot {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    padding: 13px 20px;
    border-top: 1px solid var(--rule);
    font-family: var(--f-mono);
    font-size: .75rem;
    color: var(--dim-2);
  }
  .sysmap-foot .sel { color: var(--signal); }
  .sys-open {
    color: var(--data);
    text-decoration: none;
    border: 1px solid var(--data-deep);
    padding: 7px 12px;
    white-space: nowrap;
  }
  .sys-open:hover { background: rgba(111,227,242,.1); }
  .sys-open[hidden] { display: none; }

  /* stacked, wire-free layout on narrow screens */
  @media (max-width: 760px) {
    .sysmap { grid-template-columns: 1fr; gap: 26px; padding: 18px 16px; }
    .sysmap-wires { display: none; }
  }

  /* ---------- trace / timeline (a real sequence, so numbered) ---------- */
  .trace { display: grid; gap: 0; }
  .trace-row {
    display: grid;
    grid-template-columns: 62px 1fr;
    gap: 20px;
    padding: 18px 0;
    border-top: 1px solid var(--rule);
    align-items: start;
  }
  .trace-row:last-child { border-bottom: 1px solid var(--rule); }
  .trace-n { font-family: var(--f-mono); font-size: .8rem; color: var(--signal); padding-top: 3px; }
  .trace-stage { font-family: var(--f-display); font-weight: 600; font-size: 1.02rem; }
  .trace-role { color: var(--dim); font-size: .9rem; margin-top: 3px; }
  .trace-when { font-family: var(--f-mono); font-size: .76rem; color: var(--dim-2); margin-top: 4px; }

  /* ---------- capability matrix (not a sequence: no numbers) ---------- */
  .matrix { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 26px 34px; }
  .cap { border-left: 2px solid var(--rule-2); padding-left: 16px; }
  .cap h3 { color: var(--paper); }
  .cap p { color: var(--dim); font-size: .92rem; margin-top: 7px; }

  /* ---------- work index ---------- */
  .work-list { display: grid; gap: 1px; background: var(--rule); border: 1px solid var(--rule); }
  .work-item {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 12px 24px;
    align-items: center;
    background: var(--ground);
    padding: 24px 22px;
    text-decoration: none;
    color: inherit;
    transition: background-color .18s;
  }
  .work-item:hover { background: var(--panel); }
  .work-item:hover .work-org { color: var(--signal); }
  .work-org { font-family: var(--f-display); font-weight: 600; font-size: 1.25rem; transition: color .18s; }
  .work-line { color: var(--dim); font-size: .95rem; margin-top: 6px; max-width: 62ch; }
  .work-when { font-family: var(--f-mono); font-size: .76rem; color: var(--dim-2); text-align: right; white-space: nowrap; }

  /* ---------- case study ---------- */
  .cs-head { padding: 46px 0 34px; border-bottom: 1px solid var(--rule); }
  .cs-org { font-family: var(--f-mono); font-size: .82rem; color: var(--signal); }
  .cs-head h1 { margin-top: 14px; max-width: 20ch; }
  .spec {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 1px;
    background: var(--rule);
    border: 1px solid var(--rule);
    margin-top: 30px;
  }
  .spec div { background: var(--ground); padding: 14px 16px; }
  .spec dt { font-family: var(--f-mono); font-size: .72rem; color: var(--dim-2); }
  .spec dd { margin: 6px 0 0; font-size: .9rem; line-height: 1.45; }

  .qa { display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: 28px; }
  .qa h3 { color: var(--signal); font-size: .95rem; }
  .qa p { color: var(--dim); font-size: .93rem; margin-top: 9px; }

  details.init {
    border: 1px solid var(--rule);
    background: var(--panel);
    margin-bottom: 10px;
  }
  details.init[open] { border-color: var(--rule-2); }
  details.init summary {
    list-style: none;
    cursor: pointer;
    padding: 18px 20px;
    display: grid;
    grid-template-columns: 20px 1fr;
    gap: 14px;
    align-items: start;
  }
  details.init summary::-webkit-details-marker { display: none; }
  .init-caret {
    font-family: var(--f-mono);
    color: var(--dim-2);
    font-size: .85rem;
    line-height: 1.5;
    transition: transform .2s;
  }
  details.init[open] .init-caret { transform: rotate(90deg); color: var(--signal); }
  .init-name { display: block; font-family: var(--f-display); font-weight: 600; font-size: 1.06rem; line-height: 1.3; }
  .init-sum { display: block; color: var(--dim); font-size: .92rem; margin-top: 6px; }
  .init-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 11px; }
  .tag {
    font-family: var(--f-mono);
    font-size: .68rem;
    color: var(--dim-2);
    border: 1px solid var(--rule);
    padding: 3px 7px;
  }
  .init-body { padding: 0 20px 20px 54px; }
  .init-body li { color: var(--dim); font-size: .92rem; margin-bottom: 9px; line-height: 1.58; }
  .init-body ul { margin: 0; padding-left: 18px; }
  .init-body li::marker { color: var(--rule-2); }

  .chain { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .chain .link {
    font-family: var(--f-mono);
    font-size: .76rem;
    color: var(--data);
    border: 1px solid var(--data-deep);
    padding: 6px 10px;
  }
  .chain .arr { color: var(--dim-2); font-family: var(--f-mono); }

  .learn { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 30px; }
  .learn ul { margin: 12px 0 0; padding: 0; list-style: none; }
  .learn li { color: var(--dim); font-size: .93rem; border-left: 2px solid var(--rule-2); padding-left: 14px; margin-bottom: 14px; line-height: 1.58; }

  /* ---------- journey ---------- */
  .jstage { border-top: 1px solid var(--rule); padding: 30px 0; display: grid; grid-template-columns: 210px 1fr; gap: 26px; }
  .jstage h3 { font-size: 1.12rem; }
  .jwhen { font-family: var(--f-mono); font-size: .76rem; color: var(--dim-2); margin-top: 6px; }
  .jentry { background: var(--panel); border: 1px solid var(--rule); padding: 20px; margin-bottom: 12px; }
  .jentry-top { display: flex; justify-content: space-between; gap: 14px; flex-wrap: wrap; align-items: baseline; }
  .jentry-org { font-family: var(--f-display); font-weight: 600; font-size: 1.05rem; }
  .jentry-meta { font-family: var(--f-mono); font-size: .74rem; color: var(--dim-2); }
  .jentry-role { color: var(--signal); font-size: .88rem; margin-top: 3px; }
  .jentry ul { margin: 12px 0 0; padding-left: 18px; }
  .jentry li { color: var(--dim); font-size: .91rem; margin-bottom: 7px; line-height: 1.55; }
  .jentry li::marker { color: var(--rule-2); }

  /* ---------- lab / experiments ---------- */
  .exp { border: 1px solid var(--rule); background: var(--panel); padding: 24px; margin-bottom: 14px; }
  .exp-top { display: flex; justify-content: space-between; gap: 14px; align-items: baseline; flex-wrap: wrap; }
  .exp h3 { font-size: 1.15rem; }
  .status {
    font-family: var(--f-mono);
    font-size: .7rem;
    padding: 4px 9px;
    border: 1px solid var(--rule-2);
    color: var(--dim);
  }
  .exp dl { margin: 16px 0 0; display: grid; gap: 12px; }
  .exp dt { font-family: var(--f-mono); font-size: .72rem; color: var(--signal); }
  .exp dd { margin: 5px 0 0; color: var(--dim); font-size: .93rem; line-height: 1.58; }

  /* ---------- process (a real sequence) ---------- */
  .steps { display: grid; gap: 1px; background: var(--rule); border: 1px solid var(--rule); }
  .step { background: var(--ground); padding: 18px 20px; display: grid; grid-template-columns: 46px 150px 1fr; gap: 18px; align-items: baseline; }
  .step-n { font-family: var(--f-mono); font-size: .8rem; color: var(--signal); }
  .step-name { font-family: var(--f-display); font-weight: 600; font-size: 1rem; }
  .step-d { color: var(--dim); font-size: .9rem; }

  /* ---------- about / contact ---------- */
  .cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 34px; }
  .stack { display: grid; gap: 18px; }
  .entry-t { font-weight: 600; font-size: .97rem; }
  .entry-s { color: var(--dim); font-size: .9rem; margin-top: 3px; }
  .entry-m { font-family: var(--f-mono); font-size: .74rem; color: var(--dim-2); margin-top: 4px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
  .chip { font-family: var(--f-mono); font-size: .72rem; color: var(--dim); border: 1px solid var(--rule); padding: 5px 9px; }

  .contact-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1px; background: var(--rule); border: 1px solid var(--rule); }
  .contact-cell { background: var(--ground); padding: 24px 22px; text-decoration: none; color: inherit; display: block; transition: background-color .18s; }
  .contact-cell:hover { background: var(--panel); }
  .contact-cell .ck { font-family: var(--f-mono); font-size: .74rem; color: var(--dim-2); }
  .contact-cell .cv { font-size: 1rem; margin-top: 8px; word-break: break-word; }
  .contact-cell:hover .cv { color: var(--signal); }

  /* ---------- related ---------- */
  .rel { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1px; background: var(--rule); border: 1px solid var(--rule); }
  .rel a { background: var(--ground); padding: 22px; text-decoration: none; color: inherit; transition: background-color .18s; }
  .rel a:hover { background: var(--panel); }
  .rel a:hover .rel-t { color: var(--signal); }
  .rel-k { font-family: var(--f-mono); font-size: .73rem; color: var(--dim-2); }
  .rel-t { font-family: var(--f-display); font-weight: 600; font-size: 1.02rem; margin-top: 8px; transition: color .18s; }
  .rel-d { color: var(--dim); font-size: .88rem; margin-top: 7px; }

  /* ---------- opening scene: the desk ---------- */
  .stage {
    position: fixed;
    inset: 0;
    z-index: 55;
    display: none;
    align-items: center;
    justify-content: center;
    background: radial-gradient(ellipse 90% 70% at 50% 44%, #FFFFFF 0%, #F7F4EE 55%, #FFFFFF 100%);
    pointer-events: none;
    overflow: hidden;
  }
  .stage.live { display: flex; }
  .stage-inner {
    width: min(1180px, 96vw);
    transform-origin: 50% 40%;
    will-change: transform, opacity;
  }
  .scene { display: block; width: 100%; height: auto; }

  /* A single Material-style chip: label and icon on one line, the icon in its
     own tinted disc. The old version stacked a wide-tracked uppercase label
     over a chevron faked from two rotated borders — which rendered lopsided
     and left the mark floating in dead space below the text. */
  .scroll-cue {
    /* sits above the monitor, where the eye already is, rather than at the
       bottom edge where it reads as unrelated page furniture */
    position: absolute;
    left: 50%;
    top: clamp(14px, 7vh, 62px);
    transform: translateX(-50%);
    pointer-events: auto;
    display: inline-flex;
    flex-direction: row;
    align-items: center;
    gap: 12px;
    padding: 7px 7px 7px 20px;
    cursor: pointer;
    font-family: var(--f-body);
    font-size: .95rem;
    font-weight: 500;
    letter-spacing: .005em;
    color: var(--paper);
    background: var(--panel);
    border: 1px solid var(--rule);
    border-radius: 999px;
    box-shadow: var(--md-e2);
    transition: box-shadow var(--md-short) var(--md-ease),
                border-color var(--md-short) var(--md-ease),
                transform var(--md-short) var(--md-ease);
  }
  .cue-label { white-space: nowrap; }
  .cue-icon {
    flex: none;
    width: 34px;
    height: 34px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    background: var(--signal);
    color: var(--ground);
  }
  .cue-icon svg { width: 17px; height: 17px; display: block; animation: nudge 2s var(--md-ease) infinite; }

  .scroll-cue:hover { border-color: var(--signal-deep); box-shadow: var(--md-e3); transform: translate3d(-50%, -1px, 0); }
  .scroll-cue:active { box-shadow: var(--md-e1); transform: translate3d(-50%, 1px, 0); }

  /* only the arrow moves, and only on the compositor */
  @keyframes nudge {
    0%, 100% { transform: translate3d(0, 0, 0); }
    50% { transform: translate3d(0, 3px, 0); }
  }
  @media (prefers-reduced-motion: reduce) {
    .cue-icon svg { animation: none; }
  }

  /* screen glow pulse */
  .scr-glow { animation: glow 5.5s ease-in-out infinite; transform-origin: center; }
  @keyframes glow { 0%, 100% { opacity: .5 } 50% { opacity: .82 } }

  .rgb-strip { animation: rgbshift 9s linear infinite; }
  @keyframes rgbshift { 0% { opacity: .5 } 50% { opacity: .85 } 100% { opacity: .5 } }

  #spacer { height: 0; }
  #spacer.on { height: 118vh; }

  /* reduced-motion / no-JS variant: scene sits in normal flow */
  body.static-intro .stage.live {
    position: relative;
    display: flex;
    min-height: 92vh;
    z-index: 1;
  }
  body.static-intro #spacer.on { height: 0; }
  body.static-intro .scroll-cue .chev { animation: none; }

  /* ---------- footer ---------- */
  .site-footer {
    position: relative;
    z-index: 1;
    border-top: 1px solid var(--rule);
    background: var(--ground-2);
    margin-top: 40px;
  }
  .foot-wrap { max-width: 1080px; margin: 0 auto; padding: 46px 20px 34px; }
  .foot-top { display: grid; grid-template-columns: 1fr 1.45fr; gap: 34px; align-items: start; }
  .foot-name { font-family: var(--f-display); font-weight: 700; font-size: 1.28rem; letter-spacing: -.01em; }
  .foot-role { color: var(--dim); font-size: .93rem; margin-top: 7px; max-width: 40ch; }

  .foot-facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(132px, 1fr)); gap: 22px; }
  .foot-fact dt { font-family: var(--f-mono); font-size: .71rem; color: var(--dim-2); letter-spacing: .04em; }
  .foot-fact dd { margin: 7px 0 0; font-size: .9rem; line-height: 1.45; }

  .foot-reach { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 34px; }
  .reach {
    display: inline-flex;
    align-items: center;
    gap: 9px;
    text-decoration: none;
    color: var(--paper);
    border: 1px solid var(--rule);
    background: var(--panel);
    padding: 11px 15px;
    font-size: .9rem;
    transition: border-color .16s, color .16s, background-color .16s;
  }
  .reach:hover { border-color: var(--signal-deep); color: var(--signal); background: rgba(151,89,10,.07); }
  .reach svg { width: 16px; height: 16px; flex: none; }
  .reach .rlabel { font-family: var(--f-mono); font-size: .73rem; color: var(--dim-2); }
  .reach:hover .rlabel { color: var(--signal); }

  .foot-bottom {
    display: flex;
    justify-content: space-between;
    gap: 18px;
    flex-wrap: wrap;
    align-items: center;
    margin-top: 38px;
    padding-top: 20px;
    border-top: 1px solid var(--rule);
    font-family: var(--f-mono);
    font-size: .73rem;
    color: var(--dim-2);
  }
  .foot-nav { display: flex; flex-wrap: wrap; gap: 16px; }
  .foot-nav a { color: var(--dim); text-decoration: none; }
  .foot-nav a:hover { color: var(--signal); }

  @media (max-width: 780px) {
    .foot-top { grid-template-columns: 1fr; gap: 26px; }
  }

  /* ---------- abstract plates ----------
     Stand-ins for photography. Deliberately non-photographic so nothing
     pretends to be a real memory; swap for real images when they exist. */
  .plate {
    position: relative;
    margin: 0;
    overflow: hidden;
    background: var(--ground-2);
    border: 1px solid var(--rule);
    aspect-ratio: 4 / 3;
  }
  .plate svg { display: block; width: 100%; height: 100%; }
  .plate figcaption {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    padding: 14px 16px;
    font-size: .82rem;
    color: var(--dim);
    background: linear-gradient(to top, rgba(12,18,27,.94), rgba(12,18,27,0));
  }
  .plate-wide { aspect-ratio: 16 / 7; }
  .plate-tall { aspect-ratio: 3 / 4; }

  /* the drawn artwork drifts against its frame as the section scrolls */
  .plate .art { transform: translate3d(0, calc((var(--p, .5) - .5) * -26px), 0); }

  /* ---------- live products ---------- */
  .sr-only {
    position: absolute; width: 1px; height: 1px;
    padding: 0; margin: -1px; overflow: hidden;
    clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }

  .live-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: 18px; }
  .live-card {
    display: flex;
    flex-direction: column;
    padding: 24px;
    background: var(--panel);
    border: 1px solid var(--rule);
    text-decoration: none;
    color: inherit;
    transition: border-color .3s, transform .5s var(--md-ease);
  }
  .live-card:hover, .live-card:focus-visible { border-color: var(--signal); transform: translateY(-4px); }
  .live-head { display: flex; align-items: center; gap: 14px; }

  /* fixed box, so a favicon of any shape or size cannot break the layout */
  .mark-chip {
    position: relative;
    flex: none;
    width: var(--chip, 34px);
    height: var(--chip, 34px);
    display: grid;
    place-items: center;
    background: var(--ground-2);
    border: 1px solid var(--rule-2);
    overflow: hidden;
  }
  .mark-chip img {
    position: relative;
    z-index: 1;
    width: 100%;
    height: 100%;
    object-fit: contain;
    padding: 4px;
    background: var(--ground-2);
  }
  .mark-word {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    font-family: var(--f-display);
    font-weight: 600;
    font-size: calc(var(--chip, 34px) * .46);
    color: var(--signal);
  }

  .live-name { font-family: var(--f-display); font-size: 1.1rem; font-weight: 600; }
  .live-kind { margin-top: 3px; font-size: .78rem; letter-spacing: .06em; text-transform: uppercase; color: var(--dim-2); }
  .live-blurb { margin-top: 16px; color: var(--dim); font-size: .92rem; font-weight: 300; line-height: 1.6; }
  .live-go { margin-top: auto; padding-top: 18px; font-size: .88rem; color: var(--dim-2); }
  .live-card:hover .live-go { color: var(--signal); }
  .live-go::after { content: " ↗"; }

  /* inline "visit the live site" button used inside case studies */
  .visit {
    display: inline-flex;
    align-items: center;
    gap: 11px;
    min-height: 48px;
    margin-top: 22px;
    padding: 10px 16px;
    border: 1px solid var(--signal-deep);
    background: rgba(151,89,10,.09);
    color: var(--signal);
    text-decoration: none;
    font-size: .92rem;
    transition: background-color .2s, border-color .2s;
  }
  .visit:hover { background: rgba(151,89,10,.16); border-color: var(--signal); }
  .visit::after { content: "↗"; opacity: .7; }

  /* ---------- results cards ---------- */
  .results { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
  .rcard {
    position: relative;
    display: flex;
    flex-direction: column;
    background: var(--panel);
    border: 1px solid var(--rule);
    padding: 28px 26px 22px;
    text-decoration: none;
    color: inherit;
    overflow: hidden;
    transition: border-color .3s, transform .5s var(--md-ease);
  }
  .rcard:hover, .rcard:focus-visible { border-color: var(--signal); transform: translateY(-5px); }
  .rcard-label { font-size: .8rem; font-weight: 500; letter-spacing: .1em; text-transform: uppercase; color: var(--signal); }
  .rcard h3 { margin-top: 14px; font-size: 1.3rem; font-weight: 600; }
  .rcard-figs { display: flex; gap: 28px; margin-top: 22px; }
  .rcard-fig .v {
    font-family: var(--f-display);
    font-size: 2rem;
    font-weight: 600;
    letter-spacing: -.03em;
    color: var(--data);
    line-height: 1;
  }
  .rcard-fig .k { margin-top: 7px; font-size: .82rem; color: var(--dim); }

  /* the snapshot: revealed on hover where there is a pointer, always shown
     where there is not, so touch users are never locked out of it */
  .rcard-snap {
    margin-top: 20px;
    padding-top: 18px;
    border-top: 1px solid var(--rule);
  }
  .rcard-snap li {
    color: var(--dim);
    font-size: .88rem;
    font-weight: 300;
    line-height: 1.55;
    margin-bottom: 9px;
  }
  .rcard-snap ul { margin: 0; padding-left: 17px; }
  .rcard-snap li::marker { color: var(--rule-2); }
  .rcard-go { margin-top: auto; padding-top: 18px; font-size: .86rem; color: var(--dim-2); }
  .rcard:hover .rcard-go { color: var(--signal); }

  @media (hover: hover) {
    .rcard-snap {
      max-height: 0;
      margin-top: 0;
      padding-top: 0;
      border-top-color: transparent;
      opacity: 0;
      overflow: hidden;
      transition: max-height .5s var(--md-ease), opacity .35s, margin-top .4s, padding-top .4s;
    }
    .rcard:hover .rcard-snap,
    .rcard:focus-visible .rcard-snap {
      max-height: 340px;
      margin-top: 20px;
      padding-top: 18px;
      border-top-color: var(--rule);
      opacity: 1;
    }
  }

  /* ---------- recent feed ---------- */
  .recent { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
  .rec {
    display: flex;
    flex-direction: column;
    text-align: left;
    font: inherit;
    color: inherit;
    background: var(--panel);
    border: 1px solid var(--rule);
    padding: 0;
    cursor: pointer;
    overflow: hidden;
    transition: border-color .3s, transform .5s var(--md-ease);
  }
  .rec:hover, .rec:focus-visible { border-color: var(--signal); transform: translateY(-5px); }
  .rec .plate { border: 0; border-bottom: 1px solid var(--rule); aspect-ratio: 16 / 9; }
  .rec-body { padding: 20px 22px 22px; display: flex; flex-direction: column; flex: 1; }
  .rec-kind {
    display: inline-block;
    font-size: .72rem;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--signal);
  }
  .rec h3 { margin-top: 10px; font-size: 1.12rem; font-weight: 600; }
  .rec p { margin-top: 9px; color: var(--dim); font-size: .9rem; font-weight: 300; line-height: 1.6; }
  .rec-foot {
    margin-top: auto;
    padding-top: 16px;
    display: flex;
    justify-content: space-between;
    gap: 12px;
    align-items: center;
    font-size: .8rem;
    color: var(--dim-2);
  }
  .rec:hover .rec-open { color: var(--signal); }

  .rec-stops { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
  .rec-stop {
    font-family: var(--f-mono);
    font-size: .7rem;
    color: var(--dim);
    border: 1px solid var(--rule);
    padding: 4px 8px;
  }
  .rec-stop.end { color: var(--signal); border-color: var(--signal-deep); }

  /* ---------- gallery ---------- */
  .gal-scrim {
    position: fixed; inset: 0; z-index: 70;
    background: rgba(28,36,50,.42);
    backdrop-filter: blur(4px);
    display: flex;
    align-items: stretch;
    justify-content: center;
    padding: clamp(0px, 4vh, 48px) clamp(0px, 4vw, 48px);
  }
  .gal-scrim[hidden] { display: none; }
  .gal {
    width: min(1100px, 100%);
    display: flex;
    flex-direction: column;
    background: var(--ground-2);
    border: 1px solid var(--rule-2);
    overflow: hidden;
  }
  .gal-top {
    display: flex; align-items: flex-start; justify-content: space-between;
    gap: 16px; padding: 20px 22px; border-bottom: 1px solid var(--rule);
  }
  .gal-title { font-family: var(--f-display); font-size: 1.2rem; font-weight: 600; }
  .gal-sub { margin-top: 5px; font-size: .86rem; color: var(--dim-2); }
  .gal-close {
    flex: none; width: 44px; height: 44px;
    display: grid; place-items: center;
    background: transparent; border: 1px solid var(--rule);
    color: var(--paper); font-size: 1rem; cursor: pointer;
  }
  .gal-close:hover { border-color: var(--signal); color: var(--signal); }

  .gal-cats { display: flex; gap: 8px; padding: 14px 22px; border-bottom: 1px solid var(--rule); overflow-x: auto; }
  .gal-cat {
    flex: none;
    min-height: 40px;
    padding: 8px 14px;
    font: inherit;
    font-size: .86rem;
    color: var(--dim);
    background: transparent;
    border: 1px solid var(--rule);
    cursor: pointer;
    white-space: nowrap;
    transition: color .2s, border-color .2s, background-color .2s;
  }
  .gal-cat:hover { color: var(--paper); border-color: var(--rule-2); }
  .gal-cat[aria-selected="true"] { color: var(--signal); border-color: var(--signal-deep); background: rgba(151,89,10,.09); }

  .gal-body { flex: 1; overflow-y: auto; padding: 22px; -webkit-overflow-scrolling: touch; }
  .gal-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 16px; }
  .gal-item { position: relative; }
  .gal-item .plate { aspect-ratio: 4 / 3; }
  .gal-cap { margin-top: 10px; font-size: .88rem; color: var(--dim); }
  .gal-empty {
    margin-top: 6px;
    font-size: .76rem;
    color: var(--dim-2);
  }
  .gal-note {
    margin-top: 20px;
    padding: 16px 18px;
    border: 1px dashed var(--rule-2);
    color: var(--dim-2);
    font-size: .86rem;
    line-height: 1.6;
  }

  @media (max-width: 620px) {
    .gal-scrim { padding: 0; }
    .gal { border: 0; }
  }

  /* ---------- PRD shelf ---------- */
  .prd { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
  .prd-item {
    display: flex; flex-direction: column; gap: 8px;
    padding: 22px;
    background: var(--panel);
    border: 1px solid var(--rule);
    text-decoration: none;
    color: inherit;
    transition: border-color .25s;
  }
  .prd-item:hover { border-color: var(--signal); }
  .prd-kind { font-size: .74rem; letter-spacing: .1em; text-transform: uppercase; color: var(--signal); }
  .prd-name { font-size: 1.02rem; font-weight: 600; }
  .prd-meta { font-family: var(--f-mono); font-size: .74rem; color: var(--dim-2); }
  .prd-item.pending { border-style: dashed; }
  .prd-item.pending .prd-kind { color: var(--dim-2); }

  /* ---------- wayfinding: three doors ---------- */
  .doors { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px; }
  .door {
    display: block;
    position: relative;
    padding: 30px 26px 26px;
    text-decoration: none;
    color: inherit;
    background: var(--panel);
    border: 1px solid var(--rule);
    overflow: hidden;
    transition: border-color .3s, transform .45s var(--md-ease);
  }
  .door:hover { border-color: var(--signal); transform: translateY(-4px); }
  .door-n {
    font-family: var(--f-mono);
    font-size: .74rem;
    color: var(--signal);
    letter-spacing: .04em;
  }
  .door h3 { margin-top: 14px; font-size: 1.5rem; font-weight: 600; }
  .door p { margin-top: 10px; color: var(--dim); font-size: .94rem; font-weight: 300; }
  .door-go { margin-top: 20px; display: block; font-size: .86rem; color: var(--dim-2); }
  .door:hover .door-go { color: var(--signal); }

  /* ---------- story ---------- */
  .story-lede { font-size: clamp(1.3rem, 2.6vw, 1.9rem); font-weight: 300; line-height: 1.42; letter-spacing: -.015em; color: var(--paper); max-width: 22ch; }
  .story-block { display: grid; grid-template-columns: 1fr 1fr; gap: clamp(28px, 5vw, 72px); align-items: center; }
  .story-block.flip > .plate { order: 2; }
  .story-block h3 { font-size: clamp(1.3rem, 2.4vw, 1.75rem); font-weight: 600; }
  .story-block p { margin-top: 16px; color: var(--dim); font-weight: 300; line-height: 1.7; }

  /* placeholder for copy the owner has not written yet */
  .awaiting {
    margin-top: 18px;
    padding: 20px;
    border: 1px dashed var(--rule-2);
    color: var(--dim-2);
    font-size: .9rem;
    line-height: 1.6;
    background: rgba(26,34,48,.035);
  }
  .awaiting b { color: var(--dim); font-weight: 500; display: block; margin-bottom: 6px; }

  /* ---------- beyond ---------- */
  .beyond-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 22px; }
  .beyond-card { background: var(--panel); border: 1px solid var(--rule); overflow: hidden; }
  .beyond-card .plate { border: 0; border-bottom: 1px solid var(--rule); }
  .beyond-body { padding: 22px; }
  .beyond-body h3 { font-size: 1.15rem; }
  .beyond-body p { margin-top: 10px; color: var(--dim); font-size: .93rem; font-weight: 300; line-height: 1.62; }
  .beyond-when { display: block; margin-top: 12px; font-family: var(--f-mono); font-size: .74rem; color: var(--dim-2); }

  /* ---------- experience spine ---------- */
  .xp { display: grid; gap: 0; }
  .xp-row {
    display: grid;
    grid-template-columns: 150px 1fr;
    gap: clamp(20px, 4vw, 56px);
    padding: clamp(30px, 4vh, 52px) 0;
    border-top: 1px solid var(--rule);
    align-items: start;
  }
  .xp-row:last-child { border-bottom: 1px solid var(--rule); }
  .xp-when { font-family: var(--f-mono); font-size: .8rem; color: var(--dim-2); padding-top: 6px; }
  .xp-org { font-size: clamp(1.4rem, 2.6vw, 1.9rem); font-weight: 600; letter-spacing: -.02em; }
  .xp-role { margin-top: 6px; color: var(--signal); font-size: .96rem; }
  .xp-sum { margin-top: 14px; color: var(--dim); font-weight: 300; line-height: 1.66; }
  .xp-points { margin: 16px 0 0; padding-left: 18px; }
  .xp-points li { color: var(--dim); font-size: .95rem; font-weight: 300; margin-bottom: 8px; line-height: 1.6; }
  .xp-points li::marker { color: var(--rule-2); }
  .xp-metrics { display: flex; flex-wrap: wrap; gap: 10px 26px; margin-top: 18px; }
  .xp-metric { font-size: .9rem; color: var(--dim); }
  .xp-metric b { font-family: var(--f-mono); color: var(--data); font-weight: 500; margin-right: 6px; }
  .xp-link {
    display: inline-flex; align-items: center; min-height: 44px;
    margin-top: 12px; font-size: .9rem; color: var(--signal); text-decoration: none;
  }
  .xp-link:hover { text-decoration: underline; }

  @media (max-width: 760px) {
    .story-block { grid-template-columns: 1fr; }
    .story-block.flip > .plate { order: 0; }
    .xp-row { grid-template-columns: 1fr; gap: 12px; }
    .xp-when { padding-top: 0; }
  }

  /* ---------- scroll scenes ----------
     Each [data-scene] section gets a live --p (0..1) as it crosses the
     viewport, so its parts can move at their own rates. */
  [data-scene] { --p: .5; }

  body.anim [data-scene] .sec-head {
    transform: translate3d(0, calc((var(--p) - .5) * -30px), 0);
    will-change: transform;
  }
  body.anim [data-scene] .sec-head .idx {
    letter-spacing: calc(.18em + (1 - var(--p)) * .06em);
  }
  body.anim [data-scene] .readouts,
  body.anim [data-scene] .doors,
  body.anim [data-scene] .work-list,
  body.anim [data-scene] .beyond-grid {
    transform: translate3d(0, calc((var(--p) - .5) * 18px), 0);
    will-change: transform;
  }
  body.anim [data-scene] .story-block > div {
    transform: translate3d(0, calc((var(--p) - .5) * -14px), 0);
  }
  body.anim [data-scene] .xp-when {
    transform: translate3d(0, calc((var(--p) - .5) * -20px), 0);
  }

  @media (prefers-reduced-motion: reduce) {
    body.anim [data-scene] * { transform: none !important; }
  }

  /* ---------- motion system ---------- */

  /* Reveals are opt-in: without JS every element stays at its resting,
     fully visible state, so the page is never stuck blank. The same holds
     if GSAP fails to load — body.gsap is only set once it is confirmed
     present, so a missing vendor file degrades to this CSS rather than to
     a page of permanently invisible content.
     :not(.gsap) because both systems animate opacity and transform, and a
     CSS transition left in place would re-animate every value GSAP writes. */
  body.anim:not(.gsap) .rv {
    opacity: 0;
    transform: translate3d(0, 30px, 0);
    transition:
      opacity .62s cubic-bezier(.16, 1, .3, 1),
      transform .62s cubic-bezier(.16, 1, .3, 1);
    /* capped so a long list still finishes revealing promptly */
    transition-delay: calc(min(var(--i, 0), 5) * 45ms);
  }
  body.anim:not(.gsap) .rv.in { opacity: 1; transform: translate3d(0, 0, 0); }
  body.anim:not(.gsap) .rv.instant { transition: none; transition-delay: 0s; }

  /* Route changes were a hard cut: innerHTML swaps, scroll jumps to the top,
     and everything above the fold is marked .instant so it never reveals.
     The cut reads as a page reload rather than a move within one site.
     This animates the sections themselves — never #view, whose inline
     transform the intro writes every frame — as Material's fade-through:
     out is implicit (the old markup is already gone), in is a short rise.
     Capped stagger so a long route still finishes well inside 400ms. */
  body.anim #view.route-in > section {
    animation: routeIn var(--md-short) var(--md-ease) both;
    animation-delay: calc(min(var(--s, 0), 3) * 40ms);
  }
  @keyframes routeIn {
    from { opacity: 0; transform: translate3d(0, 10px, 0); }
    to   { opacity: 1; transform: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    body.anim #view.route-in > section { animation: none; }
  }

  /* Sideways reveals only where the centred container leaves room for the
     offset. Below ~1100px the content box reaches close enough to the
     viewport edge that a 34px shift pushes past it and creates a scrollbar. */
  body.anim:not(.gsap) .rv-l, body.anim:not(.gsap) .rv-r { transform: translate3d(0, 30px, 0); }
  @media (min-width: 1100px) {
    body.anim:not(.gsap) .rv-l { transform: translate3d(-34px, 0, 0); }
    body.anim:not(.gsap) .rv-r { transform: translate3d(34px, 0, 0); }
  }
  body.anim:not(.gsap) .rv-scale { transform: translate3d(0, 26px, 0) scale(.975); }
  body.anim:not(.gsap) .rv-scale.in { transform: translate3d(0, 0, 0) scale(1); }

  .par { will-change: transform; }

  /* top scroll-progress rail */
  .rail {
    position: fixed;
    top: 0; left: 0;
    height: 2px;
    width: 100%;
    z-index: 48;
    transform: scaleX(0);
    transform-origin: 0 50%;
    background: linear-gradient(90deg, var(--data), var(--signal));
    pointer-events: none;
  }

  /* section index marker gets a live tick as you pass it */
/* panel gets a subtle pointer-tracked tilt */
  .tilt { transition: transform .5s var(--md-ease); transform-style: preserve-3d; }
  .tilt.tracking { transition: transform .12s linear; }

  /* timeline progress spine */
  .trace { position: relative; padding-left: 22px; }
  .trace::before {
    content: "";
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 2px;
    background: var(--rule);
  }
  .trace-fill {
    position: absolute;
    left: 0; top: 0;
    width: 2px;
    height: 0;
    background: linear-gradient(180deg, var(--signal), var(--data));
    box-shadow: 0 0 10px rgba(151,89,10,.30);
  }
  .trace-row { position: relative; }
  .trace-row::before {
    content: "";
    position: absolute;
    left: -27px; top: 24px;
    width: 9px; height: 9px;
    border-radius: 50%;
    background: var(--ground);
    border: 1.5px solid var(--rule-2);
    transition: border-color .35s, background-color .35s, box-shadow .35s;
  }
  .trace-row.lit::before {
    border-color: var(--signal);
    background: var(--signal);
    box-shadow: 0 0 10px 1px rgba(151,89,10,.42);
  }

  /* connector wires draw themselves in the first time they appear */
  body.anim .sysmap-wires .wire { stroke-dasharray: var(--len, 600); stroke-dashoffset: var(--len, 600); }
  body.anim .sysmap-wires.drawn .wire {
    stroke-dashoffset: 0;
    transition:
      stroke-dashoffset 1s cubic-bezier(.22, 1, .36, 1),
      stroke .2s, opacity .2s, stroke-width .2s;
    transition-delay: calc(var(--d, 0) * 40ms), 0s, 0s, 0s;
  }

  /* readouts lift slightly as they cross the viewport */
  .ro { transition: background-color .3s; }
  .ro.hot { background: var(--panel); }

  /* work rows sweep an accent edge on hover */
  .work-item { position: relative; overflow: hidden; }
  .work-item::after {
    content: "";
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 2px;
    background: var(--signal);
    transform: scaleY(0);
    transform-origin: 50% 0;
    transition: transform .4s var(--md-ease);
  }
  .work-item:hover::after { transform: scaleY(1); }

  @media (prefers-reduced-motion: reduce) {
    body.anim .rv { opacity: 1 !important; transform: none !important; transition: none !important; }
    body.anim .mapx .lnk { stroke-dasharray: none; stroke-dashoffset: 0; }
    .rail { display: none; }
    .par { transform: none !important; }
  }

  /* ---------- misc ---------- */
  .stack-24 > * + * { margin-top: 24px; }
  .back {
    display: inline-flex;
    align-items: center;
    min-height: 44px;
    font-family: var(--f-mono);
    font-size: .78rem;
    color: var(--dim);
    text-decoration: none;
    margin-top: 14px;
  }
  .back:hover { color: var(--signal); }

  /* ---------- résumé ---------- */
  .cv-head { border: 1px solid var(--rule); background: var(--panel); padding: 24px; margin-bottom: 30px; }
  .cv-name { font-family: var(--f-display); font-weight: 700; font-size: 1.5rem; letter-spacing: -.01em; }
  .cv-contact { display: flex; flex-wrap: wrap; gap: 8px 20px; margin-top: 10px; }
  .cv-contact a {
    display: inline-flex;
    align-items: center;
    min-height: 44px;
    font-family: var(--f-mono);
    font-size: .8rem;
    color: var(--data);
    text-decoration: none;
  }
  .cv-contact a:hover { text-decoration: underline; }
  .cv-summary { margin-top: 16px; color: var(--dim); font-size: .95rem; max-width: 68ch; }
  .cv-head .btn-ghost { margin-top: 18px; min-height: 44px; }

  .cv-block { margin-bottom: 34px; }
  .cv-h {
    font-family: var(--f-mono);
    font-size: .72rem;
    letter-spacing: .09em;
    color: var(--signal);
    text-transform: uppercase;
    padding-bottom: 10px;
    margin-bottom: 18px;
    border-bottom: 1px solid var(--rule);
  }
  .cv-job { margin-bottom: 22px; }
  .cv-job-top { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: baseline; }
  .cv-org { font-family: var(--f-display); font-weight: 600; font-size: 1.05rem; }
  .cv-role { color: var(--dim); font-size: .92rem; }
  .cv-when { font-family: var(--f-mono); font-size: .74rem; color: var(--dim-2); }
  .cv-points { margin: 10px 0 0; padding-left: 18px; }
  .cv-points li { color: var(--dim); font-size: .92rem; margin-bottom: 6px; line-height: 1.55; }
  .cv-points li::marker { color: var(--rule-2); }
  .cv-points strong { color: var(--paper); }
  .cv-list { margin: 0; padding-left: 18px; }
  .cv-list li { color: var(--dim); font-size: .92rem; margin-bottom: 10px; line-height: 1.55; }
  .cv-list strong { color: var(--paper); }
  .cv-skills { color: var(--dim); font-size: .9rem; margin-bottom: 10px; max-width: none; }
  .cv-skills strong { color: var(--paper); }

  /* ---------- responsive ---------- */

  /* the inline nav and the keyboard shortcut both need room and a keyboard */
  @media (max-width: 1040px) {
    .nav { display: none; }
  }
  @media (min-width: 1041px) {
    .nav-toggle-label { display: none; }
    .nav-toggle { padding: 8px 10px; }
  }
  @media (max-width: 880px) {
    .cta-top { display: none; }
  }

  @media (max-width: 780px) {
    .jstage, .step { grid-template-columns: 1fr; gap: 12px; }
    .work-item { grid-template-columns: 1fr; }
    .work-when { text-align: left; }
    section { padding: 44px 0; }
    .init-body { padding-left: 20px; }
    .container-page { padding-inline: 16px; }
    .qa, .learn, .cols { gap: 22px; }
    .spec { grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); }
    .panel { padding: 18px 16px; }
    .panel-bar { flex-direction: column; align-items: flex-start; gap: 8px; }
    .cs-head { padding: 30px 0 26px; }
    .foot-wrap { padding: 34px 16px 26px; }
    .foot-reach { gap: 8px; }
    .reach { flex: 1 1 100%; }
  }

  /* ---------- Material surface system ----------
     Applied broadly rather than per component so every card, field and
     control shares one shape scale, one elevation ramp and one easing curve.
     That consistency is most of what "clean" means in Material. */
  .rcard, .door, .rec, .live-card, .prd-item, .cap,
  .chat, .gal, .panel, .exp, .work-item, .xp, .jentry, .ro, .init, .tg {
    border-radius: var(--md-r-m);
  }
  .ask-field, .ask-send, .chat-input, .chat-send, .chat-btn,
  .cta-top, .btn-ghost, .gal-cat, .ask-chip, .reach, .visit, .drawer-cta {
    border-radius: var(--md-r-s);
  }
  .mark-chip, .msg-code, .sysnode { border-radius: var(--md-r-xs); }
  .msg-text { border-radius: var(--md-r-m); }
  .msg-you .msg-text { border-bottom-right-radius: var(--md-r-xs); }
  .msg-bot .msg-text { border-bottom-left-radius: var(--md-r-xs); }
  .plate, .prev-frame { border-radius: var(--md-r-s); }

  /* Material's state layer: a tinted veil over the surface on hover/press,
     rather than each control inventing its own hover colour. */
  .ask-chip, .chat-btn, .gal-cat, .btn-ghost, .cta-top, .reach, .nav a, .drawer-link {
    position: relative;
    isolation: isolate;
  }
  .ask-chip::before, .chat-btn::before, .gal-cat::before, .btn-ghost::before,
  .cta-top::before, .reach::before, .nav a::before, .drawer-link::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: -1;
    border-radius: inherit;
    background: currentColor;
    opacity: 0;
    transition: opacity var(--md-short) var(--md-ease);
  }
  .ask-chip:hover::before, .chat-btn:hover::before, .gal-cat:hover::before,
  .btn-ghost:hover::before, .cta-top:hover::before, .reach:hover::before,
  .nav a:hover::before, .drawer-link:hover::before { opacity: var(--md-hover); }
  .ask-chip:active::before, .chat-btn:active::before, .gal-cat:active::before,
  .btn-ghost:active::before, .cta-top:active::before,
  .reach:active::before, .drawer-link:active::before { opacity: var(--md-press); }

  /* one visible focus treatment for keyboard users, everywhere */
  a:focus-visible, button:focus-visible, input:focus-visible,
  [role="button"]:focus-visible, [tabindex]:focus-visible {
    outline: 3px solid var(--signal);
    outline-offset: 2px;
    border-radius: var(--md-r-s);
  }

  /* Material's 48dp minimum, above the 44px this already met */
  .ask-send, .chat-send, .chat-btn, .cta-top, .btn-ghost,
  .gal-cat, .visit, .drawer-cta, .scroll-cue { min-height: var(--md-target); }

  /* the preview living inside the monitor screen */
  .prev-frame {
    width: 504px;
    height: 264px;
    overflow: hidden;
    background: var(--ground);
    pointer-events: none;
  }
  .prev-scale {
    width: 1080px;
    /* 504 / 1080 — the real column, shrunk to fit the screen exactly */
    transform: scale(.4667);
    transform-origin: 0 0;
    padding: 0 20px;
  }
  .prev-scale .ask { padding-top: 26px; }
  .prev-scale .hero { padding-top: 26px; border-top: 0; }
  /* the preview is a picture of the page, never a live control */
  .prev-scale * { pointer-events: none !important; animation: none !important; transition: none !important; }
  .prev-scale .rv { opacity: 1 !important; transform: none !important; }

  /* ---------- elevation and hover interaction ----------
     On paper a border alone does not separate a card from the page, so the
     interactive surfaces carry a soft shadow. The shadow lives on a pseudo
     element and only its OPACITY animates: transitioning box-shadow itself
     repaints the card on every frame of every hover, which is exactly the
     paint-heavy continuous animation to avoid. */
  .rcard, .door, .rec, .live-card, .prd-item, .cap, .xp, .work-item {
    position: relative;
    box-shadow: var(--md-e1);

          clickTimer = null;

          paintMap(mapSelection);

        window.location.hash = "#/work/" + slug;

      // pointer preview is a desktop nicety only; the click above is the real control
      if (canHover) {
        node.addEventListener("mouseenter", function () { if (!mapSelection) paintMap(slug); });
        node.addEventListener("mouseleave", function () { if (!mapSelection) paintMap(null); });
      }
      node.addEventListener("focus", function () { if (!mapSelection) paintMap(slug); });
      node.addEventListener("blur", function () { if (!mapSelection) paintMap(null); });
    });

  /* The model answers in light markdown. Escape first, then promote only bold
     and bullets — so the output is formatted without ever trusting the string. */
  function mdLite(text) {
    var safe = esc(text);
    var lines = safe.split("\n");
    var out = "";
    var inList = false;

    for (var i = 0; i < lines.length; i++) {
      var line = lines[i];
      var bullet = line.match(/^\s*[*-]\s+(.*)$/);
      if (bullet) {
        if (!inList) { out += "<ul class='msg-list'>"; inList = true; }
        out += "<li>" + bullet[1] + "</li>";
      } else {
        if (inList) { out += "</ul>"; inList = false; }
        out += line + "\n";
      }
    }
    if (inList) out += "</ul>";

    return out
      .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
      .replace(/`([^`]+)`/g, '<code class="msg-code">$1</code>')
      .trim();
  }

  function chatRender() {
    var log = el("chatLog");
    var html = chatState.msgs.map(function (m) {
      // Sources land only once the answer has finished revealing, so they
      // read as a citation of what was just said rather than page furniture.
      var typing = m.reveal != null && m.reveal < m.text.length;
      var src = (m.sources || []).length && !typing
        ? '<div class="msg-src">' + m.sources.map(function (s, si) {
            var route = String(s.route || "");
            var style = ' style="--i:' + si + '"';
            return route.charAt(0) === "#"
              ? '<a' + style + ' href="' + esc(route) + '">' + esc(s.title) + '</a>'
              : '<span class="msg-doc"' + style + '>' + esc(s.title) + '</span>';
          }).join("") + '</div>'
        : "";
      return '<div class="msg msg-' + (m.role === "user" ? "you" : "bot") +
        (m.error ? " msg-err" : "") + '">' +
        '<div class="msg-who">' + (m.role === "user" ? "you" : "portfolio") + '</div>' +
        '<div class="msg-text">' +
          (m.role === "user"
            ? esc(m.text)
            : typing
              ? esc(m.text.slice(0, m.reveal)) + '<i class="msg-caret"></i>'
              : mdLite(m.text)) + src +
        '</div>' +
      '</div>';
    }).join("");

    if (chatState.busy) {
      html += '<div class="msg msg-bot"><div class="msg-who">portfolio</div>' +
        '<div class="chat-typing"><span class="chat-typing-dots"><i></i><i></i><i></i></span>' +
        '<span class="chat-typing-label">reading the site</span></div></div>';
    }

    log.innerHTML = html;
    log.scrollTop = log.scrollHeight;
    el("chatSend").disabled = chatState.busy;
  }

  function chatPush(msg) {
    chatState.msgs.push(msg);
    chatSave();
    chatRender();
    askSyncResume();
  }

  /* Reveals a fresh answer progressively. Only ever runs on a just-arrived
     message — restored history renders complete, so reopening the popup never
     replays old answers. */
  function chatReveal(msg) {
    var reduced = window.matchMedia &&
      window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (reduced || msg.text.length > 1400) { msg.reveal = null; chatRender(); return; }

    msg.reveal = 0;
    chatRender();

    // Patch the last bubble in place. A full re-render each frame would
    // restart every message's entry animation 60 times a second.
    var log = el("chatLog");
    var node = log.lastElementChild && log.lastElementChild.querySelector(".msg-text");
    if (!node) { msg.reveal = null; chatRender(); return; }

    var step = Math.max(2, Math.round(msg.text.length / 150));
    var timer = setInterval(function () {
      msg.reveal += step;
      if (msg.reveal >= msg.text.length) {
        clearInterval(timer);
        msg.reveal = null; // settled: re-render as formatted markdown with sources
        chatRender();
        return;
      }
      node.innerHTML = esc(msg.text.slice(0, msg.reveal)) + '<i class="msg-caret"></i>';
      log.scrollTop = log.scrollHeight;
    }, 16);
  }

  /* Keeps the resume chip on the ask bar in step with the stored conversation. */
  function askSyncResume() {
    var hint = el("askHint");
    if (!hint) return;
    var chip = hint.querySelector("[data-resume]");
    if (!chatState.msgs.length) {
      if (chip) chip.remove();
      return;
    }
    var label = "Continue where you left off (" + chatState.msgs.length + ")";
    if (chip) { chip.textContent = label; return; }
    var b = document.createElement("button");
    b.className = "ask-chip ask-resume";
    b.type = "button";
    b.setAttribute("data-resume", "1");
    b.textContent = label;
    hint.insertBefore(b, hint.firstChild);
  }

  function chatAsk(question) {
    question = String(question || "").trim();
    if (!question || chatState.busy) return;

    chatPush({ role: "user", text: question });

    if (!RAG_ENDPOINT) {
      chatPush({
        role: "model",
        error: true,
        text: "The assistant is not connected yet. In the meantime, the answer is " +
              "almost certainly somewhere on this site — or reach me directly from the contact section."
      });
      return;
    }

    chatState.busy = true;
    chatRender();

    // Only prior turns go up as history; the current question is sent separately.
    var history = chatState.msgs.slice(0, -1).filter(function (m) { return !m.error; })
      .slice(-6).map(function (m) { return { role: m.role, text: m.text }; });

    fetch(RAG_ENDPOINT, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: question, history: history })
    })
      .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, data: d }; }); })
      .then(function (res) {
        chatState.busy = false;
        if (!res.ok || !res.data || !res.data.answer) {
          chatPush({
            role: "model",
            error: true,
            text: (res.data && res.data.error) || "That did not go through. Try again in a moment."
          });
          return;
        }
        var msg = { role: "model", text: res.data.answer, sources: res.data.sources || [] };
        chatPush(msg);
        chatReveal(msg);
      })
      .catch(function () {
        chatState.busy = false;
        chatPush({
          role: "model",
          error: true,
          text: "I could not reach the assistant — check your connection and try again."
        });
      });
  }

  /* Types each suggestion into the placeholder and clears it again, so the
     field itself demonstrates what can be asked. Pauses whenever the visitor
     is actually using the input, and never runs under reduced-motion. */
  var askRotator = null;

  function askRotate() {
    if (askRotator) { clearTimeout(askRotator); askRotator = null; }
    var input = el("askInput");
    if (!input) return;
    if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;

    var i = 0, ch = 0, erasing = false;

    function step() {
      var live = el("askInput");
      if (!live) { askRotator = null; return; }

      // Hand the field back the moment it is in use.
      if (live.value || document.activeElement === live) {
        askRotator = setTimeout(step, 900);
        return;
      }

      var text = ASK_SUGGESTIONS[i % ASK_SUGGESTIONS.length];
      ch += erasing ? -2 : 1;

      if (ch >= text.length) {
        ch = text.length;
        erasing = true;
        live.setAttribute("placeholder", text);
        askRotator = setTimeout(step, 2100);
        return;
      }
      if (ch <= 0) {
        ch = 0;
        erasing = false;
        i++;
        askRotator = setTimeout(step, 260);
        return;
      }

      live.setAttribute("placeholder", text.slice(0, ch));
      askRotator = setTimeout(step, erasing ? 18 : 42);
    }

    askRotator = setTimeout(step, 1400);
  }

    var form = el("askForm");
    if (!form) return;

    });
  }

  var galState = { rec: null, cat: 0, lastFocus: null };

        esc(c.cat) + ' <span style="opacity:.6">' + c.items.length + '</span></button>';
    }).join("");

    // vary the drawn plate per slot so the grid does not read as one repeated glyph
    var kinds = ["contour", "route", "field", "horizon"];

    el("galGrid").innerHTML = cur.items.map(function (label, i) {

  function galOpen(id) {
    var rec = RECENT.filter(function (x) { return x.id === id; })[0];
    if (!rec) return;
    galState.rec = rec;
    galState.cat = 0;
    galState.lastFocus = document.activeElement;
    galRender();
    el("galScrim").hidden = false;
    document.body.classList.add("menu-open");

  function galClose() {
    el("galScrim").hidden = true;
    document.body.classList.remove("menu-open");

    galState.rec = null;
  }

  function galStep(dir) {
    if (!galState.rec) return;
    var n = (galState.rec.gallery || []).length;
    if (!n) return;
    galState.cat = (galState.cat + dir + n) % n;
    galRender();
  }

  /* =========================================================
     ABSTRACT PLATES — drawn stand-ins for photographs
     ========================================================= */

  function plate(kind, caption, cls) {
    var art = "";

    if (kind === "contour") {
      // nested contour rings, like a topographic map of somewhere unnamed
      var rings = "";
      for (var i = 0; i < 13; i++) {
        var t = i / 12;
        rings += '<ellipse cx="' + (200 + i * 4) + '" cy="' + (150 - i * 2) + '" ' +
          'rx="' + (16 + i * 15) + '" ry="' + (11 + i * 10.5) + '" ' +
          'transform="rotate(' + (-14 + i * 1.6) + ' 200 150)" ' +
          'fill="none" stroke="' + (i % 4 === 0 ? "#97A6BB" : "#D7D0C0") + '" ' +
          'stroke-width="' + (i % 4 === 0 ? 1.4 : 1) + '" opacity="' + (0.85 - t * 0.35) + '"/>';
      }
      art = rings +
        '<circle cx="204" cy="146" r="4" fill="#B0690F"/>' +
        '<circle cx="204" cy="146" r="11" fill="none" stroke="#B0690F" stroke-opacity=".45"/>';
    }

    if (kind === "route") {
      // a travelled path with stops along it
      var pts = [[34, 236], [96, 186], [150, 205], [214, 132], [276, 158], [330, 92], [372, 112]];
      var d = pts.map(function (p, i) { return (i ? "L" : "M") + p[0] + " " + p[1]; }).join(" ");
      art = '<path d="' + d + '" fill="none" stroke="#B0690F" stroke-width="1.8" ' +
        'stroke-linecap="round" stroke-linejoin="round" opacity=".85"/>' +
        pts.map(function (p, i) {
          return '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="' + (i === pts.length - 1 ? 6 : 3.5) + '" ' +
            'fill="' + (i === pts.length - 1 ? "#B0690F" : "#F1EDE4") + '" stroke="#B0690F" stroke-width="1.6"/>';
        }).join("") +
        '<path d="M0 262 H400" stroke="#D7D0C0" stroke-width="1"/>';
    }

    if (kind === "field") {
      // a scatter that resolves into a gradient — signal out of noise
      var dots = "";
      for (var r = 0; r < 9; r++) {
        for (var c = 0; c < 15; c++) {
          var x = 26 + c * 25, y = 34 + r * 26;
          var dist = Math.abs(c - 9) / 9 + Math.abs(r - 4) / 5;
          var op = Math.max(0.08, 0.92 - dist * 0.72);
          var rad = Math.max(1.1, 3.6 - dist * 2.1);
          dots += '<circle cx="' + x + '" cy="' + y + '" r="' + rad.toFixed(2) + '" ' +
            'fill="' + (dist < 0.36 ? "#B0690F" : "#0E6E7B") + '" opacity="' + op.toFixed(2) + '"/>';
        }
      }
      art = dots;
    }

    if (kind === "horizon") {
      // layered ridgelines receding into haze
      var layers = "";
      var seeds = [[210, "#F4EFE5", 0.95], [172, "#E1DBCD", 0.85], [134, "#D4CDBD", 0.7], [98, "#B4BECC", 0.5]];
      seeds.forEach(function (s, i) {
        var base = s[0], step = 40 + i * 9, path = "M0 300 L0 " + base;
        for (var x = 0; x <= 400; x += step) {
          var h = base - (((x * 7 + i * 53) % 41) - 16);
          path += " L" + x + " " + h.toFixed(0);
        }
        layers += '<path d="' + path + ' L400 300 Z" fill="' + s[1] + '" opacity="' + s[2] + '"/>';
      });
      art = layers + '<circle cx="312" cy="72" r="17" fill="#B0690F" opacity=".82"/>';
    }

    return '<figure class="plate ' + (cls || "") + '">' +
      '<svg class="art" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice" aria-hidden="true">' +
      art + '</svg>' +
      (caption ? '<figcaption>' + esc(caption) + '</figcaption>' : "") +
      '</figure>';
  }

  function render() {

    // auto behaviour the page inherits scroll-behavior: smooth and animates
    // the jump, which reads as lag when switching pages.
