  /* =========================================================
     INTRO — scroll zooms through the monitor into the console
     ========================================================= */

  var staticIntro = reduceMotion;

  /* One damped rAF loop drives the intro, parallax, the rail and the
     timeline. Scroll position is smoothed rather than read raw, which is
     what makes the whole thing feel continuous instead of stepped. */
  var M = {
    sy: 0,
    vh: window.innerHeight,
    docH: 1,
    layers: [],
    scenes: [],
    trace: null,
    started: false
  };

  function clamp01(v) { return v < 0 ? 0 : v > 1 ? 1 : v; }
  function smoothstep(t) { return t * t * (3 - 2 * t); }

  /* The intro used to read the monitor's rect every frame, right after writing
     the stage's transform — a forced synchronous layout on each of the 60
     frames the runway lasts, which is exactly the stutter it was producing.
     The geometry is fixed until the viewport changes, so it is measured once
     here and the zoomed position is derived arithmetically instead. */
  function measureIntro() {
    var stage = el("stage"), inner = el("stageInner"), scr = el("scrArea"), view = el("view");
    if (!stage || !inner || !scr || !view || !stage.classList.contains("live")) {
      M.intro = null;
      return;
    }
    var prev = inner.style.transform;
    inner.style.transform = "scale(1)";
    var s0 = inner.getBoundingClientRect();
    var r0 = scr.getBoundingClientRect();
    inner.style.transform = prev;

    M.intro = {
      // stage-inner's transform-origin is 50% 40%
      ox: s0.left + s0.width * 0.5,
      oy: s0.top + s0.height * 0.4,
      left: r0.left, top: r0.top, w: r0.width, h: r0.height
    };
  }

  function measure() {
    M.vh = window.innerHeight;
    M.vw = window.innerWidth;
    M.docH = Math.max(document.documentElement.scrollHeight - M.vh, 1);
    measureIntro();

    M.layers.forEach(function (p) {
      var r = p.el.getBoundingClientRect();
      p.top = r.top + window.scrollY;
      p.h = r.height;
    });

    M.scenes = Array.prototype.map.call(document.querySelectorAll("[data-scene]"), function (el) {
      var r = el.getBoundingClientRect();
      return { el: el, top: r.top + window.scrollY, h: r.height };
    });

    var trace = document.querySelector(".trace");
    if (trace) {
      var tr = trace.getBoundingClientRect();
      M.trace = {
        fill: trace.querySelector(".trace-fill"),
        top: tr.top + window.scrollY,
        h: tr.height,
        rows: Array.prototype.map.call(trace.querySelectorAll(".trace-row"), function (row) {
          var rr = row.getBoundingClientRect();
          return { el: row, top: rr.top + window.scrollY };
        })
      };
    } else {
      M.trace = null;
    }
  }

  function collectLayers() {
    M.layers = [];
    if (staticIntro) return;
    Array.prototype.forEach.call(document.querySelectorAll("[data-par]"), function (node) {
      node.classList.add("par");
      M.layers.push({ el: node, speed: parseFloat(node.getAttribute("data-par")) || 0.08 });
    });
  }

  function setLayer(id, ty, s) {
    var g = document.getElementById(id);
    if (!g) return;
    g.setAttribute(
      "transform",
      "translate(600 " + (350 + ty).toFixed(1) + ") scale(" + s.toFixed(4) + ") translate(-600 -350)"
    );
  }

  /* The page does not appear after the desk scene — it appears *inside* the
     monitor and grows out of it, so the next section is on screen (small, but
     legible) from the first few pixels of scroll. The old version zoomed the
     whole scene away and left an empty frame before content arrived, which
     read as a dead gap with no hint anything was coming.

     The scroll runway is the spacer, so progress and the spacer end together:
     at p=1 the content sits exactly where normal document flow puts it and the
     transform is dropped with nothing moving. */
  function introSpan() {
    var sp = el("spacer");
    return Math.max(1, sp ? sp.offsetHeight : M.vh * 1.2);
  }

  /* True while the overview is still being shown as a preview on the monitor. */
  function introHolding() {
    var stage = el("stage");
    if (staticIntro || !stage || !stage.classList.contains("live")) return false;
    return window.scrollY < introSpan();
  }

  function releaseView() {
    var view = el("view");
    if (!view) return;
    // Left over from the version that scaled the page itself; clearing these
    // keeps an older cached build from stranding the content mid-transform.
    if (view.style.transform || view.style.clipPath) {
      view.style.transform = "";
      view.style.clipPath = "";
      view.style.willChange = "";
      view.style.zIndex = "";
      view.style.opacity = "";
    }
    M.introOut = 1;
  }

  /* Fills the monitor with a still of the page that is coming. It is a clone,
     stripped of anything interactive, living inside the SVG — so it scales
     with the monitor on its own and nothing has to be recomputed per frame. */
  function fillPreview() {
    var body = el("scrPreviewBody");
    var view = el("view");
    if (!body || !view) return;
    body.innerHTML = "";

    var want = [view.querySelector(".ask"), view.querySelector(".hero")];
    for (var i = 0; i < want.length; i++) {
      if (!want[i]) continue;
      var copy = want[i].cloneNode(true);
      // Duplicate ids would collide with the real controls below.
      copy.removeAttribute("id");
      Array.prototype.forEach.call(copy.querySelectorAll("[id]"), function (n) {
        n.removeAttribute("id");
      });
      Array.prototype.forEach.call(copy.querySelectorAll("input"), function (n) {
        n.setAttribute("tabindex", "-1");
        n.setAttribute("readonly", "readonly");
      });
      Array.prototype.forEach.call(copy.querySelectorAll("a, button"), function (n) {
        n.setAttribute("tabindex", "-1");
      });
      // Behavioural hooks must not survive into a decorative copy, or a
      // selector meant for the real control finds the picture of one first.
      Array.prototype.forEach.call(copy.querySelectorAll("[data-gal], [data-ask], [data-resume]"), function (n) {
        n.removeAttribute("data-gal");
        n.removeAttribute("data-ask");
        n.removeAttribute("data-resume");
      });
      // A resume chip is conversation state, meaningless in a still of the
      // page — and leaving the class on a hidden copy makes ".ask-resume"
      // resolve to the picture rather than the real control.
      Array.prototype.forEach.call(copy.querySelectorAll(".ask-resume"), function (n) {
        n.parentNode.removeChild(n);
      });
      body.appendChild(copy);
    }
  }

  /* The intro no longer scales the page itself. Transforming and re-clipping
     #view — which contains the whole document — forced the compositor to
     re-rasterise an enormous layer every frame, and that is what flickered
     while scrolling. Only the desk SVG moves now, and the preview inside it
     is part of that SVG, so it is genuinely fixed to the screen it sits on. */
  function updateIntro(sy) {
    var stage = el("stage");
    if (!stage || staticIntro) return;
    if (!stage.classList.contains("live")) { releaseView(); return; }

    /* Scroll sets a target; the intro plays toward it at its own pace.
       Bound rigidly to scroll position, a hard trackpad flick advanced this
       by a third per frame and the whole sequence rendered in three frames —
       the animation existed but was never actually seen. Damped follow keeps
       deliberate scrolling 1:1 (small deltas stay under the cap), while a
       flick is paced to roughly 900ms so the intro is experienced either way.
       This is not scroll-hijacking: the page keeps scrolling underneath. */
    var targetP = clamp01(sy / introSpan());
    if (M.introP == null) M.introP = targetP;
    var gap = targetP - M.introP;
    var stepCap = 1 / 55;
    var stepP = gap * 0.16;
    if (stepP > stepCap) stepP = stepCap;
    if (stepP < -stepCap) stepP = -stepCap;
    // Snap on a wider threshold than the loop stops on (0.0015), so the last
    // fraction always lands inside a frame the loop is still running. Equal
    // thresholds let the loop quit one frame before the snap and strand the
    // intro just short of the end. 0.004 of the runway is imperceptible.
    M.introP += Math.abs(gap) < 0.004 ? gap : stepP;

    var p = clamp01(M.introP);
    var e = smoothstep(p);

    // A slow push toward the desk, so the monitor grows as it is approached.
    var zoom = 1 + e * 0.52;
    el("stageInner").style.transform = "scale(" + zoom.toFixed(4) + ")";

    setLayer("layFore", e * 120, 1 + e * 0.30);
    setLayer("layDesk", e * 62, 1 + e * 0.16);
    setLayer("layMid", e * 6, 1 + e * 0.04);
    setLayer("layBack", e * -22, 1 - e * 0.03);

    // The terminal line hands the screen over to a still of the real page,
    // early, so what is coming is legible for most of the scroll.
    var handover = clamp01((p - 0.04) / 0.14);
    var scrText = el("scrText");
    if (scrText) scrText.setAttribute("opacity", (1 - handover).toFixed(3));
    var prev = el("scrPreview");
    if (prev) prev.setAttribute("opacity", handover.toFixed(3));

    // Then the desk dissolves and the real page is simply behind it.
    var fadeFrom = 0.62;
    var stageOp = p < fadeFrom ? 1 : clamp01(1 - (p - fadeFrom) / 0.34);
    stage.style.opacity = stageOp.toFixed(3);
    // Hide on the opacity, not on p reaching the very end. visibility is
    // inherited, so this is what pulls the monitor's preview clone out of the
    // accessibility tree and the tab order; leave it "visible" and the page
    // carries a second, invisible ask bar and hero forever. Keying it to
    // p >= 0.999 was safe only while p tracked scroll exactly — the damped
    // follow converges asymptotically and the rAF loop stops on the same
    // threshold the snap uses, so p could strand a hair short and the clone
    // never left the tree.
    stage.style.visibility = stageOp === 0 ? "hidden" : "visible";
    M.introOut = p;

    el("topbar").style.opacity = clamp01((p - 0.55) / 0.3).toFixed(3);
    var cue = el("scrollCue");
    if (cue) cue.style.opacity = clamp01(1 - p * 2.6).toFixed(3);
  }

  function updateTrace(sy) {
    if (!M.trace) return;
    var t = M.trace;
    var start = t.top - M.vh * 0.72;
    var p = clamp01((sy - start) / (t.h + M.vh * 0.25));
    if (t.fill) t.fill.style.height = (p * t.h).toFixed(1) + "px";
    var line = sy + M.vh * 0.72;
    t.rows.forEach(function (r) { r.el.classList.toggle("lit", r.top < line); });
  }

  /* The loop runs only while something is actually moving. It used to schedule
     itself forever, so a stationary page still woke the compositor 60 times a
     second for identical writes. Scroll, resize and route changes restart it. */
  function wake() {
    if (M.raf == null) M.raf = requestAnimationFrame(frame);
  }

  function frame() {
    M.raf = null;
    var target = window.scrollY;
    M.sy += (target - M.sy) * (staticIntro ? 1 : 0.13);
    var settled = Math.abs(target - M.sy) < 0.06;
    if (settled) M.sy = target;
    var sy = M.sy;

    var rail = el("rail");
    if (rail) rail.style.transform = "scaleX(" + (sy / M.docH).toFixed(4) + ")";

    // The intro tracks the raw scroll rather than the damped value: it is
    // pinned under the finger, and lag there reads as the animation sticking.
    updateIntro(target);
    updateTrace(sy);

    // While the page is a preview on the monitor it must hold still. Driving
    // its scenes and parallax from the live scroll animated the *contents* of
    // the screen as the runway advanced, which looked like the picture inside
    // the monitor scrolling. Freezing them at the scroll position the intro
    // lands on means the preview shows exactly the page you arrive at.
    var csy = introHolding() ? introSpan() : sy;

    // Every section publishes its own 0..1 scroll progress, so each one can
    // carry motion of its own rather than sharing one global parallax.
    for (var si = 0; si < M.scenes.length; si++) {
      var sc = M.scenes[si];
      if (sc.top - csy > M.vh * 1.4 || sc.top + sc.h - csy < -M.vh * 0.4) continue;
      var prog = (csy + M.vh - sc.top) / (sc.h + M.vh);
      sc.el.style.setProperty("--p", (prog < 0 ? 0 : prog > 1 ? 1 : prog).toFixed(4));
    }

    // layered parallax across sections
    var center = csy + M.vh / 2;
    for (var i = 0; i < M.layers.length; i++) {
      var p = M.layers[i];
      var rel = (center - (p.top + p.h / 2)) / M.vh;
      if (rel < -1.8 || rel > 1.8) continue;
      var t = "translate3d(0," + (rel * p.speed * 100).toFixed(2) + "px,0)";
      if (p.last !== t) { p.el.style.transform = t; p.last = t; }
    }

    // The intro runs on its own clock, so the loop has to outlive the scroll
    // that started it — otherwise a flick freezes the sequence part-played.
    var introBusy = M.intro && el("stage") && el("stage").classList.contains("live") &&
      Math.abs(clamp01(window.scrollY / introSpan()) - (M.introP == null ? 0 : M.introP)) > 0.0015;
    if (!settled || introBusy) wake();
  }

  /* ---------- reveals ---------- */

  var revealIO = null;
  var seenIO = null;
  var revealTweens = [];

  /* GSAP is a plain script tag here, not a bundle, so it can simply be absent:
     a vendored file that failed to copy, or a stale cached page. Everything
     GSAP-driven checks this rather than assuming, and falls back to the CSS
     reveal system, which is why body.gsap is set from the same test. */
  function hasGsap() {
    return typeof window.gsap !== "undefined" && typeof window.ScrollTrigger !== "undefined";
  }

  function setupReveals() {
    if (revealIO) revealIO.disconnect();
    if (seenIO) seenIO.disconnect();

    var sections = document.querySelectorAll("section");
    seenIO = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) {
        if (en.isIntersecting) en.target.classList.add("seen");
      });
    }, { threshold: 0.12 });
    Array.prototype.forEach.call(sections, function (s) { seenIO.observe(s); });

    var items = document.querySelectorAll(".rv");
    if (staticIntro) {
      Array.prototype.forEach.call(items, function (n) { n.classList.add("in"); });
      return;
    }

    if (hasGsap()) { setupRevealsGsap(items); return; }

    revealIO = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) {
        if (!en.isIntersecting) return;
        en.target.classList.add("in");
        revealIO.unobserve(en.target);
      });
    }, { rootMargin: "0px 0px -6% 0px", threshold: 0.05 });

    Array.prototype.forEach.call(items, function (n) {
      // anything already on screen shows immediately — the first frame is never blank
      if (n.getBoundingClientRect().top < window.innerHeight * 0.96) {
        n.classList.add("instant", "in");
      } else {
        revealIO.observe(n);
      }
    });
  }

  /* The GSAP form of the same behaviour. Two things it buys over the observer:
     the offsets live in one place instead of being split between a CSS rule
     and a rootMargin, and ScrollTrigger recomputes them on resize, which the
     observer never did.

     The motion is deliberately identical to what the CSS produced — 0.62s on
     the same curve, 30px rise, capped 45ms stagger — because this is a port,
     not a redesign. Changing the feel and the mechanism in one step would
     leave nothing to compare against if it looked wrong. */
  function setupRevealsGsap(items) {
    for (var t = 0; t < revealTweens.length; t++) revealTweens[t].kill();
    revealTweens = [];
    // A route change replaces the DOM under ScrollTrigger; its stored start
    // and end offsets belong to markup that no longer exists.
    window.ScrollTrigger.getAll().forEach(function (st) {
      if (st.vars && st.vars.id === "rv") st.kill();
    });

    Array.prototype.forEach.call(items, function (n) {
      var cs = getComputedStyle(n);
      var i = parseFloat(cs.getPropertyValue("--i")) || 0;
      var delay = Math.min(i, 5) * 0.045;

      var from = { opacity: 0, duration: 0.62, ease: "expo.out", delay: delay, overwrite: "auto" };
      // Sideways variants only apply above 1100px; below it the CSS keeps them
      // vertical because a 34px shift reaches past the content box and opens a
      // scrollbar. Reading the class here has to respect the same breakpoint.
      var wide = window.matchMedia("(min-width: 1100px)").matches;
      if (n.classList.contains("rv-l") && wide) from.x = -34;
      else if (n.classList.contains("rv-r") && wide) from.x = 34;
      else if (n.classList.contains("rv-scale")) { from.y = 26; from.scale = 0.975; }
      else from.y = 30;

      // Already on screen: show it now, with no scroll trigger at all. The
      // first frame is never blank.
      if (n.getBoundingClientRect().top < window.innerHeight * 0.96) {
        n.classList.add("in");
        revealTweens.push(window.gsap.from(n, from));
        return;
      }

      n.classList.add("in");
      from.scrollTrigger = { id: "rv", trigger: n, start: "top 94%", once: true };
      revealTweens.push(window.gsap.from(n, from));
    });
  }

  /* ---------- map: draw the links in ---------- */

  function setupMapDraw() {
    var svg = el("sysWires");
    var shell = el("sysmap");
    if (!svg || !shell) return;

    var wires = svg.querySelectorAll(".wire");
    if (!wires.length) return;

    Array.prototype.forEach.call(wires, function (l, i) {
      var len = 640;
      try { len = Math.ceil(l.getTotalLength()); } catch (e) { /* not measurable yet */ }
      l.style.setProperty("--len", len);
      l.style.setProperty("--d", i);
    });

    if (staticIntro) { svg.classList.add("drawn"); return; }

    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) {
        if (!en.isIntersecting) return;
        svg.classList.add("drawn");
        io.disconnect();
      });
    }, { threshold: 0.15 });
    io.observe(shell);
  }

  /* ---------- pointer-tracked tilt ---------- */

  function bindTilt() {
    if (staticIntro) return;
    Array.prototype.forEach.call(document.querySelectorAll(".tilt"), function (node) {
      node.addEventListener("pointermove", function (ev) {
        if (ev.pointerType === "touch") return;
        var r = node.getBoundingClientRect();
        var dx = (ev.clientX - r.left) / r.width - 0.5;
        var dy = (ev.clientY - r.top) / r.height - 0.5;
        node.classList.add("tracking");
        node.style.transform =
          "perspective(1100px) rotateX(" + (-dy * 2.4).toFixed(2) + "deg) rotateY(" + (dx * 3.2).toFixed(2) + "deg)";
      });
      node.addEventListener("pointerleave", function () {
        node.classList.remove("tracking");
        node.style.transform = "";
      });
    });
  }

  function motionRoute(isHome) {
    var stage = el("stage");
    if (!staticIntro && isHome) {
      stage.style.opacity = "1";
      stage.style.visibility = "visible";
      el("stageInner").style.transform = "scale(1)";
      el("stageInner").style.filter = "none";
      el("topbar").style.opacity = "0";
      M.sy = 0;
    } else {
      stage.style.opacity = "";
      el("stageInner").style.transform = "";
      el("stageInner").style.filter = "";
      el("topbar").style.opacity = "";
      releaseView();
    }

    collectLayers();
    setupReveals();
    setupMapDraw();
    bindTilt();
    requestAnimationFrame(function () { measure(); });

    if (!M.started) {
      M.started = true;
      // Passive: the listener only wakes the loop, it never blocks the scroll.
      window.addEventListener("scroll", wake, { passive: true });
    }
    wake();
  }

  function typeScreen() {
    var nameNode = el("scName");
    var tagNode = el("scTag");
    var caret = el("scCaret");
    if (!nameNode || !tagNode) return;

    var NAME = "Avinash";
    var TAG = "a Metacognist & Philomath";

    // Deep-linked to an inner route: the scene is hidden, so measuring text would fail.
    if (staticIntro || !el("stage").classList.contains("live")) {
      nameNode.textContent = NAME;
      tagNode.textContent = TAG;
      if (caret) caret.setAttribute("x", "379");
      return;
    }

    var i = 0, j = 0;
    caret.style.display = "none";

    var t1 = setInterval(function () {
      i++;
      nameNode.textContent = NAME.slice(0, i);
      if (i >= NAME.length) {
        clearInterval(t1);
        caret.style.display = "";
        setTimeout(function () {
          var t2 = setInterval(function () {
            j++;
            tagNode.textContent = TAG.slice(0, j);
            try {
              caret.setAttribute("x", String(379 + tagNode.getComputedTextLength() + 4));
            } catch (e) { /* text not measurable yet */ }
            if (j >= TAG.length) clearInterval(t2);
          }, 34);
        }, 260);
      }
    }, 90);
  }

  /* =========================================================
     LOAD SEQUENCE — one orchestrated moment, home only
     ========================================================= */

  var countIO = null;

  function runCount(n) {
    var m = n.textContent.trim().match(/^(\d+)(.*)$/);
    if (!m) return;
    var target = parseInt(m[1], 10);
    var suffix = m[2];
    if (target < 2) return;

    var start = performance.now();
    var dur = 900;
    n.textContent = "0" + suffix;
    (function tick(now) {
      var p = Math.min((now - start) / dur, 1);
      var eased = 1 - Math.pow(1 - p, 4);
      n.textContent = Math.round(target * eased) + suffix;
      if (p < 1) requestAnimationFrame(tick);
      else n.textContent = target + suffix;
    })(start);
  }

  function countUp() {
    if (reduceMotion) return;
    if (countIO) countIO.disconnect();

    var nodes = document.querySelectorAll(".ro .v");
    countIO = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) {
        if (!en.isIntersecting) return;
        runCount(en.target);
        en.target.closest(".ro").classList.add("hot");
        countIO.unobserve(en.target);
      });
    }, { threshold: 0.55 });

    Array.prototype.forEach.call(nodes, function (n) { countIO.observe(n); });
  }

  /* =========================================================
     MENU DRAWER — reaches every page at any screen size
     ========================================================= */

  function renderMenu() {
    el("navBody").innerHTML = MENU.map(function (g) {
      var items = g.items.map(function (i) {
        return '<a class="drawer-link" href="' + i.path + '">' +
          '<span class="dl-name">' + esc(i.label) + '</span>' +
          '<span class="dl-note">' + esc(i.note) + '</span>' +
        '</a>';
      }).join("");
      return '<div class="drawer-group"><div class="drawer-group-name">' + esc(g.group) + '</div></div>' + items;
    }).join("");
  }

  var menuOpen = false;
  var lastFocus = null;

  function openMenu() {
    if (menuOpen) return;
    menuOpen = true;
    lastFocus = document.activeElement;
    el("navScrim").hidden = false;
    var d = el("navDrawer");
    d.setAttribute("aria-hidden", "false");
    // next frame so the transition runs from the closed position
    requestAnimationFrame(function () { d.classList.add("open"); });
    el("navToggle").setAttribute("aria-expanded", "true");
    document.body.classList.add("menu-open");
    el("navClose").focus();
  }

  function closeMenu() {
    if (!menuOpen) return;
    menuOpen = false;
    var d = el("navDrawer");
    d.classList.remove("open");
    d.setAttribute("aria-hidden", "true");
    el("navScrim").hidden = true;
    el("navToggle").setAttribute("aria-expanded", "false");
    document.body.classList.remove("menu-open");
    if (lastFocus && lastFocus.focus) lastFocus.focus();
  }

  /* =========================================================
     BOOT
     ========================================================= */

  el("nav").innerHTML = NAV.map(function (n) {
    return '<a href="' + n.path + '">' + esc(n.label) + '</a>';
  }).join("");

  renderMenu();
  el("navToggle").addEventListener("click", function () { menuOpen ? closeMenu() : openMenu(); });
  el("navClose").addEventListener("click", closeMenu);
  el("navScrim").addEventListener("click", closeMenu);

  chatLoad();
  el("chatClose").addEventListener("click", chatClose);
  el("chatScrim").addEventListener("click", function (e) {
    if (e.target === el("chatScrim")) chatClose();
  });
  el("chatClear").addEventListener("click", function () {
    chatState.msgs = [];
    chatSave();
    chatRender();
    askSyncResume();
    el("chatInput").focus();
  });
  el("chatForm").addEventListener("submit", function (e) {
    e.preventDefault();
    var input = el("chatInput");
    var q = input.value;
    if (!q.trim()) return;
    input.value = "";
    chatAsk(q);
  });
  // A source link navigates the page underneath, so the dialog has to get out of the way.
  el("chatLog").addEventListener("click", function (e) {
    if (e.target.closest(".msg-src a")) chatClose();
  });

  el("galClose").addEventListener("click", galClose);
  el("galScrim").addEventListener("click", function (e) {
    if (e.target === el("galScrim")) galClose();
  });
  el("galCats").addEventListener("click", function (e) {
    var b = e.target.closest("[data-cat]");
    if (!b) return;
    galState.cat = parseInt(b.getAttribute("data-cat"), 10);
    galRender();
  });

  document.addEventListener("keydown", function (e) {
    var galOpenNow = !el("galScrim").hidden;
    if (e.key === "Escape") {
      if (!el("chatScrim").hidden) { e.preventDefault(); chatClose(); return; }
      if (galOpenNow) { e.preventDefault(); galClose(); return; }
      if (menuOpen) { e.preventDefault(); closeMenu(); return; }
    }
    if (!galOpenNow) return;
    if (e.key === "ArrowRight") { e.preventDefault(); galStep(1); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); galStep(-1); }
  });

  if (staticIntro) document.body.classList.add("static-intro");
  // Reveal animations are opt-in, so the page renders fully without JS.
  if (!staticIntro) document.body.classList.add("anim");
  // Set only once GSAP is confirmed loaded. The CSS reveal system stays live
  // until then, so a missing vendor file costs the upgrade, not the content.
  if (!staticIntro && hasGsap()) {
    document.body.classList.add("gsap");
    window.gsap.defaults({ ease: "power3.out", duration: 0.3 });
  }

  /* Reaching for anything while the page is still a preview lands the intro
     instead. The first tap is spent settling — the targets under it are a
     fraction of their real size and still moving, so acting on it would mean
     hitting whatever happened to be under the finger mid-flight. */
  el("view").addEventListener("pointerdown", function (e) {
    if (!introHolding() || (M.introOut || 0) > 0.82) return;
    e.preventDefault();
    e.stopPropagation();
    window.scrollTo({ top: Math.round(introSpan()), behavior: "auto" });
  }, true);

  // One tap clears the whole intro rather than dropping the visitor partway
  // through it, still holding a preview they cannot use yet.
  el("scrollCue").addEventListener("click", function () {
    window.scrollTo({
      top: Math.round(introSpan()),
      behavior: staticIntro ? "auto" : "smooth"
    });
  });

  // On a phone the full desk is too small to read, so frame the monitor instead.
  function fitScene() {
    var svg = document.querySelector(".scene");
    if (!svg) return;
    var w = window.innerWidth;
    if (w <= 560) svg.setAttribute("viewBox", "300 96 600 470");
    else if (w <= 860) svg.setAttribute("viewBox", "170 80 860 560");
    else svg.setAttribute("viewBox", "0 0 1200 700");
  }

  // Delegated so it survives every re-render.
  el("view").addEventListener("click", function (ev) {
    if (ev.target && ev.target.id === "printCv") window.print();
  });

  var resizeTimer = null;
  window.addEventListener("resize", function () {
    fitScene();
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () { measure(); drawWires(); wake(); }, 140);
  });

  // late assets (fonts) change geometry, so re-measure once settled
  window.addEventListener("load", function () {
    setTimeout(function () { measure(); drawWires(); wake(); }, 60);
  });

  fitScene();

  window.addEventListener("hashchange", render);
  renderFooter();
  render();
  typeScreen();
})();
</script>
