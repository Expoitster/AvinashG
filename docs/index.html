<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Avinash Garudapalli — AI product manager. Voice AI, generative and agentic products, and the business case underneath them.">

<meta property="og:title" content="Avinash Garudapalli">
<meta property="og:description" content="Avinash Garudapalli — AI product manager. Voice AI, generative and agentic products, and the business case underneath them.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%23101722'/><circle cx='16' cy='16' r='7' fill='%23FFB03A'/></svg>">

  :root { color-scheme: dark; }

  img { max-width: 100%; }

</style>
</head>
<body>
<title>Avinash Garudapalli</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;450;500;600&display=swap">

<style>
  :root {
    --ground: #101722;
    --ground-2: #0C121B;
    --panel: #16202E;
    --panel-2: #1B2736;
    --rule: #26364E;
    --rule-2: #35496A;
    --paper: #EDE8DC;
    --dim: #93A2BC;
    --dim-2: #64748E;
    --signal: #FFB03A;
    --signal-deep: #7A5316;
    --data: #6FE3F2;
    --data-deep: #1E5A66;
    --good: #79E0A8;

    --f-display: "Chakra Petch", "Trebuchet MS", sans-serif;
    --f-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
    --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;

    --topbar-h: 52px;
    --statusbar-h: 30px;
    --measure: 66ch;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--ground);
    color: var(--paper);
    font-family: var(--f-body);
    font-size: 16px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    padding-bottom: var(--statusbar-h);
    overflow-x: hidden;
  }
  body.menu-open { overflow: hidden; }

  /* ---------- backdrop: faint measurement grid ---------- */
  .backdrop {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    background-image:
      linear-gradient(to right, rgba(53,73,106,.16) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(53,73,106,.10) 1px, transparent 1px);
    background-size: 64px 64px;
    mask-image: radial-gradient(ellipse 120% 80% at 50% 0%, #000 20%, transparent 78%);
  }

  /* ---------- top bar ---------- */
  .topbar {
    position: sticky;
    top: 0;
    z-index: 40;
    height: var(--topbar-h);
    display: flex;
    align-items: center;
    gap: 24px;
    padding: 0 20px;
    background: rgba(12,18,27,.92);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--rule);
  }

  .mark {
    font-family: var(--f-display);
    font-weight: 700;
    font-size: 1rem;
    letter-spacing: .04em;
    color: var(--paper);
    text-decoration: none;
    display: flex;
    align-items: center;
    gap: 9px;
    white-space: nowrap;
  }
  .mark .dot {
    width: 7px; height: 7px;
    background: var(--signal);
    border-radius: 50%;
    box-shadow: 0 0 0 3px rgba(255,176,58,.16);
    animation: pulse 2.6s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { opacity:1 } 50% { opacity:.35 } }

  .nav { display: flex; gap: 2px; margin-left: auto; }
  .nav a {
    font-family: var(--f-body);
    font-size: .875rem;
    font-weight: 450;
    color: var(--dim);
    text-decoration: none;
    padding: 7px 11px;
    border: 1px solid transparent;
    transition: color .16s, border-color .16s;
  }
  .nav a:hover { color: var(--paper); border-color: var(--rule); }
  .nav a[aria-current="page"] { color: var(--signal); border-color: var(--signal-deep); }

  .cta-top {
    font-family: var(--f-mono);
    font-size: .74rem;
    text-transform: uppercase;
    letter-spacing: .04em;
    color: var(--signal);
    text-decoration: none;
    border: 1px solid var(--signal-deep);
    background: rgba(255,176,58,.08);
    padding: 8px 13px;
    white-space: nowrap;
    transition: background-color .16s, border-color .16s;
  }
  .cta-top:hover { background: rgba(255,176,58,.18); border-color: var(--signal); }

  .kbd-open {
    font-family: var(--f-mono);
    font-size: .75rem;
    color: var(--dim-2);
    background: var(--panel);
    border: 1px solid var(--rule);
    padding: 7px 9px;
    cursor: pointer;
    transition: color .16s, border-color .16s;
  }
  .kbd-open:hover { color: var(--paper); border-color: var(--rule-2); }

  /* ---------- menu drawer (all sizes) ---------- */
  .nav-toggle {
    display: inline-flex;
    align-items: center;
    gap: 9px;
    min-height: 40px;
    padding: 8px 12px;
    font-family: var(--f-mono);
    font-size: .75rem;
    color: var(--paper);
    background: var(--panel);
    border: 1px solid var(--rule);
    cursor: pointer;
    transition: border-color .16s;
  }
  .nav-toggle:hover { border-color: var(--signal); }
  .bars { display: inline-grid; gap: 3px; width: 15px; }
  .bars i { display: block; height: 1.5px; background: currentColor; }
  .bars i:nth-child(2) { width: 70%; }

  .drawer-scrim {
    position: fixed;
    inset: 0;
    z-index: 64;
    background: rgba(6, 10, 16, .72);
    backdrop-filter: blur(2px);
  }
  .drawer-scrim[hidden] { display: none; }

  .drawer {
    position: fixed;
    top: 0; right: 0; bottom: 0;
    z-index: 65;
    width: min(400px, 88vw);
    display: flex;
    flex-direction: column;
    background: var(--ground-2);
    border-left: 1px solid var(--rule-2);
    transform: translateX(102%);
    transition: transform .42s cubic-bezier(.16, 1, .3, 1);
    padding-bottom: env(safe-area-inset-bottom, 0);
  }
  .drawer.open { transform: translateX(0); }
  .drawer[aria-hidden="true"] { visibility: hidden; }
  .drawer.open[aria-hidden="false"] { visibility: visible; }

  .drawer-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 18px;
    border-bottom: 1px solid var(--rule);
  }
  .drawer-title { font-family: var(--f-mono); font-size: .76rem; color: var(--dim-2); letter-spacing: .05em; }
  .drawer-close {
    width: 40px; height: 40px;
    display: grid; place-items: center;
    background: transparent;
    border: 1px solid var(--rule);
    color: var(--paper);
    font-size: .95rem;
    cursor: pointer;
  }
  .drawer-close:hover { border-color: var(--signal); color: var(--signal); }

  .drawer-body { flex: 1; overflow-y: auto; padding: 6px 0 14px; -webkit-overflow-scrolling: touch; }
  .drawer-group { padding: 14px 18px 4px; }
  .drawer-group-name {
    font-family: var(--f-mono);
    font-size: .68rem;
    letter-spacing: .09em;
    color: var(--dim-2);
    padding-bottom: 8px;
  }
  .drawer-link {
    display: block;
    padding: 12px 18px;
    min-height: 52px;
    text-decoration: none;
    color: var(--paper);
    border-left: 2px solid transparent;
    transition: background-color .16s, border-color .16s;
  }
  .drawer-link:hover { background: var(--panel); border-left-color: var(--rule-2); }
  .drawer-link[aria-current="page"] { border-left-color: var(--signal); background: rgba(255,176,58,.07); }
  .drawer-link[aria-current="page"] .dl-name { color: var(--signal); }
  .dl-name { display: block; font-size: .97rem; font-weight: 500; }
  .dl-note { display: block; font-size: .8rem; color: var(--dim-2); margin-top: 3px; line-height: 1.4; }

  .drawer-cta {
    display: block;
    margin: 0 18px 18px;
    padding: 14px;
    text-align: center;
    font-family: var(--f-mono);
    font-size: .78rem;
    text-transform: uppercase;
    letter-spacing: .05em;
    text-decoration: none;
    color: var(--signal);
    border: 1px solid var(--signal-deep);
    background: rgba(255,176,58,.08);
  }
  .drawer-cta:hover { background: rgba(255,176,58,.18); }

  /* ---------- layout ---------- */
  .wrap {
    position: relative;
    z-index: 1;
    max-width: 1080px;
    margin: 0 auto;
    padding: 0 20px;
  }

  section { padding: 68px 0; border-bottom: 1px solid var(--rule); }
  section:last-of-type { border-bottom: 0; }

  h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; }

  h1 {
    font-size: clamp(2rem, 4.4vw, 2.95rem);
    font-weight: 700;
    line-height: 1.06;
    letter-spacing: -.015em;
  }
  h2 {
    font-size: clamp(1.45rem, 3vw, 2.05rem);
    font-weight: 600;
    line-height: 1.12;
    letter-spacing: -.01em;
  }
  h3 { font-size: 1.1rem; font-weight: 600; line-height: 1.25; }

  p { margin: 0; max-width: var(--measure); }
  .lede { font-size: 1.075rem; color: var(--dim); line-height: 1.62; }

  /* section head: left rule encodes section boundary, no eyebrow labels */
  .sec-head { display: flex; align-items: baseline; gap: 16px; margin-bottom: 30px; }
  .sec-head .idx {
    font-family: var(--f-mono);
    font-size: .8rem;
    color: var(--dim-2);
    padding-top: 4px;
    white-space: nowrap;
  }
  .sec-head .txt { flex: 1; min-width: 0; }
  .sec-head p { margin-top: 12px; color: var(--dim); font-size: .975rem; }

  a { color: var(--data); }
  a:focus-visible, button:focus-visible, summary:focus-visible, input:focus-visible, canvas:focus-visible {
    outline: 2px solid var(--signal);
    outline-offset: 2px;
  }

  .num { font-variant-numeric: tabular-nums; }

  /* ---------- panel: instrument chrome ---------- */
  .panel {
    position: relative;
    background: var(--panel);
    border: 1px solid var(--rule);
    padding: 26px;
  }
  .panel::before, .panel::after {
    content: "";
    position: absolute;
    width: 9px; height: 9px;
    border-color: var(--rule-2);
    border-style: solid;
    pointer-events: none;
  }
  .panel::before { top: -1px; left: -1px; border-width: 1px 0 0 1px; }
  .panel::after  { bottom: -1px; right: -1px; border-width: 0 1px 1px 0; }

  .panel-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    padding-bottom: 14px;
    margin-bottom: 20px;
    border-bottom: 1px solid var(--rule);
  }
  .panel-title { font-family: var(--f-display); font-weight: 600; font-size: 1rem; letter-spacing: .01em; }
  .panel-note { font-family: var(--f-mono); font-size: .72rem; color: var(--dim-2); line-height: 1.5; }

  /* ---------- hero ---------- */
  .hero { padding-top: 34px; padding-bottom: 56px; }
  .console-line {
    font-family: var(--f-mono);
    font-size: .8rem;
    color: var(--dim-2);
    margin-bottom: 20px;
    min-height: 1.3em;
  }
  .console-line b { color: var(--good); font-weight: 500; }
  .caret {
    display: inline-block;
    width: 7px; height: 1em;
    background: var(--signal);
    vertical-align: -2px;
    animation: blink 1.05s steps(1) infinite;
  }
  @keyframes blink { 0%,50% { opacity:1 } 50.01%,100% { opacity:0 } }

  .hero h1 { max-width: 21ch; }
  .hero .lede { margin-top: 16px; }
  .hero-meta {
    margin-top: 18px;
    display: flex;
    gap: 10px 26px;
    flex-wrap: wrap;
    font-family: var(--f-mono);
    font-size: .8rem;
    color: var(--dim-2);
  }
  .hero-meta span b { color: var(--dim); font-weight: 400; }

  /* ---------- latency lab ---------- */
  .lab { margin-top: 30px; }

  .budget {
    display: flex;
    height: 54px;
    border: 1px solid var(--rule-2);
    overflow: hidden;
    background: var(--ground-2);
  }
  .seg {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    min-width: 0;
    border-right: 1px solid rgba(16,23,34,.7);
    transition: flex-grow .55s cubic-bezier(.22,1,.36,1), background-color .3s;
    overflow: hidden;
  }
  .seg:last-child { border-right: 0; }
  .seg span {
    font-family: var(--f-mono);
    font-size: .68rem;
    color: rgba(16,23,34,.86);
    font-weight: 600;
    white-space: nowrap;
    padding: 0 4px;
  }
  .seg.s-net { background: #3E5470; }
  .seg.s-vad { background: #4E7E86; }
  .seg.s-stt { background: var(--data); }
  .seg.s-llm { background: var(--signal); }
  .seg.s-tts { background: #E08A4C; }
  .seg.s-out { background: #7C6A55; }

  .budget-legend {
    display: none;
    grid-template-columns: 1fr 1fr;
    gap: 7px 14px;
    margin-top: 14px;
  }
  .budget-legend div { display: flex; align-items: center; gap: 8px; font-family: var(--f-mono); font-size: .72rem; color: var(--dim); }
  .budget-legend i { width: 10px; height: 10px; flex: none; }
  .budget-legend i.s-net { background: #3E5470; }
  .budget-legend i.s-vad { background: #4E7E86; }
  .budget-legend i.s-stt { background: var(--data); }
  .budget-legend i.s-llm { background: var(--signal); }
  .budget-legend i.s-tts { background: #E08A4C; }
  .budget-legend i.s-out { background: #7C6A55; }

  .track {
    position: relative;
    height: 20px;
    margin-top: 2px;
    border-left: 1px solid var(--rule);
    border-right: 1px solid var(--rule);
  }
  .packet {
    position: absolute;
    top: 5px;
    left: 0;
    width: 9px; height: 9px;
    background: var(--signal);
    border-radius: 50%;
    box-shadow: 0 0 10px 2px rgba(255,176,58,.55);
    animation: travel var(--dur, 3s) linear infinite;
  }
  @keyframes travel {
    0%   { left: 0; opacity: 0; }
    6%   { opacity: 1; }
    94%  { opacity: 1; }
    100% { left: calc(100% - 9px); opacity: 0; }
  }
  .lab.paused .packet { animation-play-state: paused; }

  .lab-readout {
    display: flex;
    align-items: flex-end;
    gap: 30px;
    flex-wrap: wrap;
    margin-top: 24px;
    padding-top: 20px;
    border-top: 1px solid var(--rule);
  }
  .readout-big {
    font-family: var(--f-display);
    font-weight: 700;
    font-size: clamp(2.4rem, 6vw, 3.6rem);
    line-height: .95;
    color: var(--signal);
    letter-spacing: -.02em;
  }
  .readout-big .unit { font-size: .38em; color: var(--dim); margin-left: 6px; letter-spacing: 0; }
  .readout-label { font-size: .85rem; color: var(--dim); margin-top: 8px; max-width: 34ch; }
  .verdict {
    font-family: var(--f-mono);
    font-size: .78rem;
    padding: 8px 12px;
    border: 1px solid var(--rule);
    color: var(--dim);
    background: var(--ground-2);
    line-height: 1.45;
    max-width: 40ch;
  }
  .verdict.hit { border-color: var(--good); color: var(--good); }

  .toggles {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(216px, 1fr));
    gap: 10px;
    margin-top: 24px;
  }
  .tg {
    display: flex;
    align-items: flex-start;
    gap: 11px;
    padding: 13px 14px;
    background: var(--ground-2);
    border: 1px solid var(--rule);
    cursor: pointer;
    text-align: left;
    font: inherit;
    color: var(--dim);
    transition: border-color .16s, color .16s, background-color .16s;
  }
  .tg:hover { border-color: var(--rule-2); color: var(--paper); }
  .tg[aria-pressed="true"] { border-color: var(--signal-deep); background: rgba(255,176,58,.06); color: var(--paper); }
  .tg .led {
    flex: none;
    width: 9px; height: 9px;
    margin-top: 6px;
    border-radius: 50%;
    background: var(--rule-2);
    transition: background-color .2s, box-shadow .2s;
  }
  .tg[aria-pressed="true"] .led { background: var(--signal); box-shadow: 0 0 8px 1px rgba(255,176,58,.6); }
  .tg .tg-name { display: block; font-size: .9rem; font-weight: 500; line-height: 1.3; }
  .tg .tg-delta { display: block; font-family: var(--f-mono); font-size: .74rem; color: var(--dim-2); margin-top: 3px; }
  .tg[aria-pressed="true"] .tg-delta { color: var(--signal); }

  .lab-controls { display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
  .btn-ghost {
    font-family: var(--f-mono);
    font-size: .76rem;
    color: var(--dim);
    background: transparent;
    border: 1px solid var(--rule);
    padding: 8px 13px;
    cursor: pointer;
    transition: color .16s, border-color .16s;
  }
  .btn-ghost:hover { color: var(--paper); border-color: var(--rule-2); }

  /* ---------- readouts (impact) ---------- */
  .readouts { display: grid; grid-template-columns: repeat(auto-fit, minmax(232px, 1fr)); gap: 1px; background: var(--rule); border: 1px solid var(--rule); }
  .ro { background: var(--ground); padding: 22px 20px; }
  .ro .v {
    font-family: var(--f-display);
    font-weight: 700;
    font-size: 2.1rem;
    line-height: 1;
    letter-spacing: -.02em;
    color: var(--data);
  }
  .ro .k { font-size: .92rem; font-weight: 500; margin-top: 10px; }
  .ro .d { font-size: .82rem; color: var(--dim-2); margin-top: 6px; line-height: 1.5; }

  /* ---------- capability map ----------
     Real DOM elements so it reflows at any width; the connector wires are a
     progressive enhancement drawn from measured positions on wide screens. */
  .sysmap-shell { border: 1px solid var(--rule); background: var(--ground-2); }

  .sysmap {
    position: relative;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0 84px;
    padding: 20px;
  }
  .sysmap-wires {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    overflow: visible;
    pointer-events: none;
    z-index: 0;
  }
  .sysmap-wires .wire {
    fill: none;
    stroke: #35496A;
    stroke-width: 1.2;
    opacity: .5;
    transition: stroke .2s, opacity .2s, stroke-width .2s;
  }
  .sysmap-wires .wire.on { stroke: var(--signal); stroke-width: 2; opacity: 1; }
  .sysmap.picking .wire:not(.on) { opacity: .07; }

  .sys-col { position: relative; z-index: 1; min-width: 0; }
  .sys-col-head {
    font-family: var(--f-mono);
    font-size: .7rem;
    letter-spacing: .07em;
    color: var(--dim-2);
    margin-bottom: 12px;
  }
  .sys-list { display: grid; gap: 10px; }

  .sysnode {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 12px;
    align-items: center;
    width: 100%;
    min-height: 58px;
    text-align: left;
    font: inherit;
    color: var(--paper);
    background: #131C29;
    border: 1px solid #40587C;
    padding: 11px 14px;
    cursor: pointer;
    transition: border-color .2s, background-color .2s;
  }
  .sysnode:hover { border-color: var(--signal); }
  .sysnode[aria-pressed="true"] { border-color: var(--signal); background: rgba(255,176,58,.1); }
  .sysnode-name { display: block; font-family: var(--f-display); font-weight: 600; font-size: 1rem; line-height: 1.2; }
  .sysnode-sub { display: block; font-family: var(--f-mono); font-size: .7rem; color: var(--dim-2); margin-top: 3px; }
  .sysnode-n {
    font-family: var(--f-mono);
    font-size: .72rem;
    color: var(--dim-2);
    border: 1px solid var(--rule);
    padding: 3px 7px;
    white-space: nowrap;
  }
  .sysnode[aria-pressed="true"] .sysnode-n { color: var(--signal); border-color: var(--signal-deep); }

  .syscap {
    display: flex;
    align-items: center;
    min-height: 52px;
    border: 1px solid #2E3D57;
    background: #131C29;
    color: var(--dim);
    font-size: .93rem;
    padding: 10px 14px;
    transition: border-color .2s, color .2s, background-color .2s;
  }
  .syscap.on { border-color: var(--data); color: var(--data); background: rgba(111,227,242,.08); }

  .sysmap-foot {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    padding: 13px 20px;
    border-top: 1px solid var(--rule);
    font-family: var(--f-mono);
    font-size: .75rem;
    color: var(--dim-2);
  }
  .sysmap-foot .sel { color: var(--signal); }
  .sys-open {
    color: var(--data);
    text-decoration: none;
    border: 1px solid var(--data-deep);
    padding: 7px 12px;
    white-space: nowrap;
  }
  .sys-open:hover { background: rgba(111,227,242,.1); }
  .sys-open[hidden] { display: none; }

  /* stacked, wire-free layout on narrow screens */
  @media (max-width: 760px) {
    .sysmap { grid-template-columns: 1fr; gap: 26px; padding: 18px 16px; }
    .sysmap-wires { display: none; }
  }

  /* ---------- trace / timeline (a real sequence, so numbered) ---------- */
  .trace { display: grid; gap: 0; }
  .trace-row {
    display: grid;
    grid-template-columns: 62px 1fr;
    gap: 20px;
    padding: 18px 0;
    border-top: 1px solid var(--rule);
    align-items: start;
  }
  .trace-row:last-child { border-bottom: 1px solid var(--rule); }
  .trace-n { font-family: var(--f-mono); font-size: .8rem; color: var(--signal); padding-top: 3px; }
  .trace-stage { font-family: var(--f-display); font-weight: 600; font-size: 1.02rem; }
  .trace-role { color: var(--dim); font-size: .9rem; margin-top: 3px; }
  .trace-when { font-family: var(--f-mono); font-size: .76rem; color: var(--dim-2); margin-top: 4px; }

  /* ---------- capability matrix (not a sequence: no numbers) ---------- */
  .matrix { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 26px 34px; }
  .cap { border-left: 2px solid var(--rule-2); padding-left: 16px; }
  .cap h3 { color: var(--paper); }
  .cap p { color: var(--dim); font-size: .92rem; margin-top: 7px; }

  /* ---------- work index ---------- */
  .work-list { display: grid; gap: 1px; background: var(--rule); border: 1px solid var(--rule); }
  .work-item {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 12px 24px;
    align-items: center;
    background: var(--ground);
    padding: 24px 22px;
    text-decoration: none;
    color: inherit;
    transition: background-color .18s;
  }
  .work-item:hover { background: var(--panel); }
  .work-item:hover .work-org { color: var(--signal); }
  .work-org { font-family: var(--f-display); font-weight: 600; font-size: 1.25rem; transition: color .18s; }
  .work-line { color: var(--dim); font-size: .95rem; margin-top: 6px; max-width: 62ch; }
  .work-when { font-family: var(--f-mono); font-size: .76rem; color: var(--dim-2); text-align: right; white-space: nowrap; }

  /* ---------- case study ---------- */
  .cs-head { padding: 46px 0 34px; border-bottom: 1px solid var(--rule); }
  .cs-org { font-family: var(--f-mono); font-size: .82rem; color: var(--signal); }
  .cs-head h1 { margin-top: 14px; max-width: 20ch; }
  .spec {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 1px;
    background: var(--rule);
    border: 1px solid var(--rule);
    margin-top: 30px;
  }
  .spec div { background: var(--ground); padding: 14px 16px; }
  .spec dt { font-family: var(--f-mono); font-size: .72rem; color: var(--dim-2); }
  .spec dd { margin: 6px 0 0; font-size: .9rem; line-height: 1.45; }

  .qa { display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: 28px; }
  .qa h3 { color: var(--signal); font-size: .95rem; }
  .qa p { color: var(--dim); font-size: .93rem; margin-top: 9px; }

  details.init {
    border: 1px solid var(--rule);
    background: var(--panel);
    margin-bottom: 10px;
  }
  details.init[open] { border-color: var(--rule-2); }
  details.init summary {
    list-style: none;
    cursor: pointer;
    padding: 18px 20px;
    display: grid;
    grid-template-columns: 20px 1fr;
    gap: 14px;
    align-items: start;
  }
  details.init summary::-webkit-details-marker { display: none; }
  .init-caret {
    font-family: var(--f-mono);
    color: var(--dim-2);
    font-size: .85rem;
    line-height: 1.5;
    transition: transform .2s;
  }
  details.init[open] .init-caret { transform: rotate(90deg); color: var(--signal); }
  .init-name { font-family: var(--f-display); font-weight: 600; font-size: 1.06rem; }
  .init-sum { color: var(--dim); font-size: .92rem; margin-top: 6px; }
  .init-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 11px; }
  .tag {
    font-family: var(--f-mono);
    font-size: .68rem;
    color: var(--dim-2);
    border: 1px solid var(--rule);
    padding: 3px 7px;
  }
  .init-body { padding: 0 20px 20px 54px; }
  .init-body li { color: var(--dim); font-size: .92rem; margin-bottom: 9px; line-height: 1.58; }
  .init-body ul { margin: 0; padding-left: 18px; }
  .init-body li::marker { color: var(--rule-2); }

  .chain { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .chain .link {
    font-family: var(--f-mono);
    font-size: .76rem;
    color: var(--data);
    border: 1px solid var(--data-deep);
    padding: 6px 10px;
  }
  .chain .arr { color: var(--dim-2); font-family: var(--f-mono); }

  .learn { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 30px; }
  .learn ul { margin: 12px 0 0; padding: 0; list-style: none; }
  .learn li { color: var(--dim); font-size: .93rem; border-left: 2px solid var(--rule-2); padding-left: 14px; margin-bottom: 14px; line-height: 1.58; }

  /* ---------- journey ---------- */
  .jstage { border-top: 1px solid var(--rule); padding: 30px 0; display: grid; grid-template-columns: 210px 1fr; gap: 26px; }
  .jstage h3 { font-size: 1.12rem; }
  .jwhen { font-family: var(--f-mono); font-size: .76rem; color: var(--dim-2); margin-top: 6px; }
  .jentry { background: var(--panel); border: 1px solid var(--rule); padding: 20px; margin-bottom: 12px; }
  .jentry-top { display: flex; justify-content: space-between; gap: 14px; flex-wrap: wrap; align-items: baseline; }
  .jentry-org { font-family: var(--f-display); font-weight: 600; font-size: 1.05rem; }
  .jentry-meta { font-family: var(--f-mono); font-size: .74rem; color: var(--dim-2); }
  .jentry-role { color: var(--signal); font-size: .88rem; margin-top: 3px; }
  .jentry ul { margin: 12px 0 0; padding-left: 18px; }
  .jentry li { color: var(--dim); font-size: .91rem; margin-bottom: 7px; line-height: 1.55; }
  .jentry li::marker { color: var(--rule-2); }

  /* ---------- lab / experiments ---------- */
  .exp { border: 1px solid var(--rule); background: var(--panel); padding: 24px; margin-bottom: 14px; }
  .exp-top { display: flex; justify-content: space-between; gap: 14px; align-items: baseline; flex-wrap: wrap; }
  .exp h3 { font-size: 1.15rem; }
  .status {
    font-family: var(--f-mono);
    font-size: .7rem;
    padding: 4px 9px;
    border: 1px solid var(--rule-2);
    color: var(--dim);
  }
  .exp dl { margin: 16px 0 0; display: grid; gap: 12px; }
  .exp dt { font-family: var(--f-mono); font-size: .72rem; color: var(--signal); }
  .exp dd { margin: 5px 0 0; color: var(--dim); font-size: .93rem; line-height: 1.58; }

  /* ---------- process (a real sequence) ---------- */
  .steps { display: grid; gap: 1px; background: var(--rule); border: 1px solid var(--rule); }
  .step { background: var(--ground); padding: 18px 20px; display: grid; grid-template-columns: 46px 150px 1fr; gap: 18px; align-items: baseline; }
  .step-n { font-family: var(--f-mono); font-size: .8rem; color: var(--signal); }
  .step-name { font-family: var(--f-display); font-weight: 600; font-size: 1rem; }
  .step-d { color: var(--dim); font-size: .9rem; }

  /* ---------- about / contact ---------- */
  .cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 34px; }
  .stack { display: grid; gap: 18px; }
  .entry-t { font-weight: 600; font-size: .97rem; }
  .entry-s { color: var(--dim); font-size: .9rem; margin-top: 3px; }
  .entry-m { font-family: var(--f-mono); font-size: .74rem; color: var(--dim-2); margin-top: 4px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
  .chip { font-family: var(--f-mono); font-size: .72rem; color: var(--dim); border: 1px solid var(--rule); padding: 5px 9px; }

  .contact-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1px; background: var(--rule); border: 1px solid var(--rule); }
  .contact-cell { background: var(--ground); padding: 24px 22px; text-decoration: none; color: inherit; display: block; transition: background-color .18s; }
  .contact-cell:hover { background: var(--panel); }
  .contact-cell .ck { font-family: var(--f-mono); font-size: .74rem; color: var(--dim-2); }
  .contact-cell .cv { font-size: 1rem; margin-top: 8px; word-break: break-word; }
  .contact-cell:hover .cv { color: var(--signal); }

  /* ---------- related ---------- */
  .rel { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1px; background: var(--rule); border: 1px solid var(--rule); }
  .rel a { background: var(--ground); padding: 22px; text-decoration: none; color: inherit; transition: background-color .18s; }
  .rel a:hover { background: var(--panel); }
  .rel a:hover .rel-t { color: var(--signal); }
  .rel-k { font-family: var(--f-mono); font-size: .73rem; color: var(--dim-2); }
  .rel-t { font-family: var(--f-display); font-weight: 600; font-size: 1.02rem; margin-top: 8px; transition: color .18s; }
  .rel-d { color: var(--dim); font-size: .88rem; margin-top: 7px; }

  /* ---------- status bar ---------- */
  .statusbar {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    z-index: 45;
    height: var(--statusbar-h);
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 0 14px;
    background: var(--ground-2);
    border-top: 1px solid var(--rule);
    font-family: var(--f-mono);
    font-size: .72rem;
    color: var(--dim-2);
    overflow-x: auto;
    white-space: nowrap;
  }
  .statusbar .sb-route { color: var(--signal); }
  .statusbar button {
    font: inherit;
    background: transparent;
    border: 0;
    color: var(--dim-2);
    cursor: pointer;
    padding: 4px 0;
  }
  .statusbar button:hover { color: var(--paper); }
  .sb-right { margin-left: auto; display: flex; gap: 18px; }

  /* ---------- command palette ---------- */
  .palette-scrim {
    position: fixed; inset: 0; z-index: 60;
    background: rgba(8,12,18,.72);
    display: none;
    padding-top: 12vh;
    justify-content: center;
  }
  .palette-scrim.open { display: flex; }
  .palette {
    width: min(560px, 92vw);
    height: fit-content;
    background: var(--panel);
    border: 1px solid var(--rule-2);
    box-shadow: 0 30px 70px rgba(0,0,0,.55);
  }
  .palette input {
    width: 100%;
    font-family: var(--f-mono);
    font-size: .95rem;
    color: var(--paper);
    background: var(--ground-2);
    border: 0;
    border-bottom: 1px solid var(--rule);
    padding: 16px 18px;
    outline: none;
  }
  .palette input::placeholder { color: var(--dim-2); }
  .palette ul { list-style: none; margin: 0; padding: 6px; max-height: 46vh; overflow-y: auto; }
  .palette li a {
    display: flex; justify-content: space-between; gap: 14px;
    padding: 11px 13px;
    text-decoration: none;
    color: var(--dim);
    font-size: .92rem;
  }
  .palette li a .p-path { font-family: var(--f-mono); font-size: .74rem; color: var(--dim-2); }
  .palette li[data-active="true"] a { background: var(--ground-2); color: var(--paper); }
  .palette li[data-active="true"] a .p-path { color: var(--signal); }
  .palette-empty { padding: 18px; color: var(--dim-2); font-size: .88rem; }

  /* ---------- opening scene: the desk ---------- */
  .stage {
    position: fixed;
    inset: 0;
    z-index: 55;
    display: none;
    align-items: center;
    justify-content: center;
    background: radial-gradient(ellipse 90% 70% at 50% 44%, #16202E 0%, #0B111A 55%, #070B11 100%);
    pointer-events: none;
    overflow: hidden;
  }
  .stage.live { display: flex; }
  .stage-inner {
    width: min(1180px, 96vw);
    transform-origin: 50% 40%;
    will-change: transform, opacity;
  }
  .scene { display: block; width: 100%; height: auto; }

  .scroll-cue {
    position: absolute;
    left: 50%;
    bottom: 34px;
    transform: translateX(-50%);
    pointer-events: auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 9px;
    background: transparent;
    border: 0;
    cursor: pointer;
    font-family: var(--f-mono);
    font-size: .74rem;
    letter-spacing: .08em;
    color: var(--dim);
    padding: 8px 14px;
  }
  .scroll-cue:hover { color: var(--signal); }
  .scroll-cue .chev {
    width: 15px; height: 15px;
    border-right: 1.5px solid currentColor;
    border-bottom: 1.5px solid currentColor;
    transform: rotate(45deg);
    animation: nudge 1.9s ease-in-out infinite;
  }
  @keyframes nudge {
    0%, 100% { transform: rotate(45deg) translate(0, 0); opacity: .5; }
    50% { transform: rotate(45deg) translate(3px, 3px); opacity: 1; }
  }

  /* screen glow pulse */
  .scr-glow { animation: glow 5.5s ease-in-out infinite; transform-origin: center; }
  @keyframes glow { 0%, 100% { opacity: .5 } 50% { opacity: .82 } }

  .rgb-strip { animation: rgbshift 9s linear infinite; }
  @keyframes rgbshift { 0% { opacity: .5 } 50% { opacity: .85 } 100% { opacity: .5 } }

  #spacer { height: 0; }
  #spacer.on { height: 172vh; }

  /* reduced-motion / no-JS variant: scene sits in normal flow */
  body.static-intro .stage.live {
    position: relative;
    display: flex;
    min-height: 92vh;
    z-index: 1;
  }
  body.static-intro #spacer.on { height: 0; }
  body.static-intro .scroll-cue .chev { animation: none; }

  /* ---------- footer ---------- */
  .site-footer {
    position: relative;
    z-index: 1;
    border-top: 1px solid var(--rule);
    background: var(--ground-2);
    margin-top: 40px;
  }
  .foot-wrap { max-width: 1080px; margin: 0 auto; padding: 46px 20px 34px; }
  .foot-top { display: grid; grid-template-columns: 1fr 1.45fr; gap: 34px; align-items: start; }
  .foot-name { font-family: var(--f-display); font-weight: 700; font-size: 1.28rem; letter-spacing: -.01em; }
  .foot-role { color: var(--dim); font-size: .93rem; margin-top: 7px; max-width: 40ch; }

  .foot-facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(132px, 1fr)); gap: 22px; }
  .foot-fact dt { font-family: var(--f-mono); font-size: .71rem; color: var(--dim-2); letter-spacing: .04em; }
  .foot-fact dd { margin: 7px 0 0; font-size: .9rem; line-height: 1.45; }

  .foot-reach { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 34px; }
  .reach {
    display: inline-flex;
    align-items: center;
    gap: 9px;
    text-decoration: none;
    color: var(--paper);
    border: 1px solid var(--rule);
    background: var(--panel);
    padding: 11px 15px;
    font-size: .9rem;
    transition: border-color .16s, color .16s, background-color .16s;
  }
  .reach:hover { border-color: var(--signal-deep); color: var(--signal); background: rgba(255,176,58,.06); }
  .reach svg { width: 16px; height: 16px; flex: none; }
  .reach .rlabel { font-family: var(--f-mono); font-size: .73rem; color: var(--dim-2); }
  .reach:hover .rlabel { color: var(--signal); }

  .foot-bottom {
    display: flex;
    justify-content: space-between;
    gap: 18px;
    flex-wrap: wrap;
    align-items: center;
    margin-top: 38px;
    padding-top: 20px;
    border-top: 1px solid var(--rule);
    font-family: var(--f-mono);
    font-size: .73rem;
    color: var(--dim-2);
  }
  .foot-nav { display: flex; flex-wrap: wrap; gap: 16px; }
  .foot-nav a { color: var(--dim); text-decoration: none; }
  .foot-nav a:hover { color: var(--signal); }

  @media (max-width: 780px) {
    .foot-top { grid-template-columns: 1fr; gap: 26px; }
  }

  /* ---------- motion system ---------- */

  /* Reveals are opt-in: without JS every element stays at its resting,
     fully visible state, so the page is never stuck blank. */
  body.anim .rv {
    opacity: 0;
    transform: translate3d(0, 30px, 0);
    transition:
      opacity .78s cubic-bezier(.16, 1, .3, 1),
      transform .78s cubic-bezier(.16, 1, .3, 1);
    transition-delay: calc(var(--i, 0) * 65ms);
  }
  body.anim .rv.in { opacity: 1; transform: translate3d(0, 0, 0); }
  body.anim .rv.instant { transition: none; transition-delay: 0s; }

  /* things that slide in from the side rather than up */
  body.anim .rv-l { transform: translate3d(-34px, 0, 0); }
  body.anim .rv-r { transform: translate3d(34px, 0, 0); }
  body.anim .rv-scale { transform: translate3d(0, 26px, 0) scale(.975); }
  body.anim .rv-scale.in { transform: translate3d(0, 0, 0) scale(1); }

  .par { will-change: transform; }

  /* top scroll-progress rail */
  .rail {
    position: fixed;
    top: 0; left: 0;
    height: 2px;
    width: 100%;
    z-index: 48;
    transform: scaleX(0);
    transform-origin: 0 50%;
    background: linear-gradient(90deg, var(--data), var(--signal));
    pointer-events: none;
  }

  /* section index marker gets a live tick as you pass it */
  .sec-head .idx { position: relative; padding-left: 14px; }
  .sec-head .idx::before {
    content: "";
    position: absolute;
    left: 0; top: 10px;
    width: 6px; height: 6px;
    background: var(--rule-2);
    transition: background-color .45s, box-shadow .45s;
  }
  section.seen .sec-head .idx::before {
    background: var(--signal);
    box-shadow: 0 0 9px 1px rgba(255,176,58,.55);
  }

  /* panel gets a subtle pointer-tracked tilt */
  .tilt { transition: transform .5s cubic-bezier(.16,1,.3,1); transform-style: preserve-3d; }
  .tilt.tracking { transition: transform .12s linear; }

  /* timeline progress spine */
  .trace { position: relative; padding-left: 22px; }
  .trace::before {
    content: "";
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 2px;
    background: var(--rule);
  }
  .trace-fill {
    position: absolute;
    left: 0; top: 0;
    width: 2px;
    height: 0;
    background: linear-gradient(180deg, var(--signal), var(--data));
    box-shadow: 0 0 10px rgba(255,176,58,.35);
  }
  .trace-row { position: relative; }
  .trace-row::before {
    content: "";
    position: absolute;
    left: -27px; top: 24px;
    width: 9px; height: 9px;
    border-radius: 50%;
    background: var(--ground);
    border: 1.5px solid var(--rule-2);
    transition: border-color .35s, background-color .35s, box-shadow .35s;
  }
  .trace-row.lit::before {
    border-color: var(--signal);
    background: var(--signal);
    box-shadow: 0 0 10px 1px rgba(255,176,58,.5);
  }

  /* connector wires draw themselves in the first time they appear */
  body.anim .sysmap-wires .wire { stroke-dasharray: var(--len, 600); stroke-dashoffset: var(--len, 600); }
  body.anim .sysmap-wires.drawn .wire {
    stroke-dashoffset: 0;
    transition:
      stroke-dashoffset 1s cubic-bezier(.22, 1, .36, 1),
      stroke .2s, opacity .2s, stroke-width .2s;
    transition-delay: calc(var(--d, 0) * 40ms), 0s, 0s, 0s;
  }

  /* readouts lift slightly as they cross the viewport */
  .ro { transition: background-color .3s; }
  .ro.hot { background: var(--panel); }

  /* work rows sweep an accent edge on hover */
  .work-item { position: relative; overflow: hidden; }
  .work-item::after {
    content: "";
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 2px;
    background: var(--signal);
    transform: scaleY(0);
    transform-origin: 50% 0;
    transition: transform .4s cubic-bezier(.16,1,.3,1);
  }
  .work-item:hover::after { transform: scaleY(1); }

  @media (prefers-reduced-motion: reduce) {
    body.anim .rv { opacity: 1 !important; transform: none !important; transition: none !important; }
    body.anim .mapx .lnk { stroke-dasharray: none; stroke-dashoffset: 0; }
    .rail { display: none; }
    .par { transform: none !important; }
  }

  /* ---------- misc ---------- */
  .stack-24 > * + * { margin-top: 24px; }
  .back {
    display: inline-block;
    font-family: var(--f-mono);
    font-size: .78rem;
    color: var(--dim);
    text-decoration: none;
    margin-top: 26px;
  }
  .back:hover { color: var(--signal); }

  /* ---------- résumé ---------- */
  .cv-head { border: 1px solid var(--rule); background: var(--panel); padding: 24px; margin-bottom: 30px; }
  .cv-name { font-family: var(--f-display); font-weight: 700; font-size: 1.5rem; letter-spacing: -.01em; }
  .cv-contact { display: flex; flex-wrap: wrap; gap: 8px 20px; margin-top: 10px; }
  .cv-contact a { font-family: var(--f-mono); font-size: .8rem; color: var(--data); text-decoration: none; }
  .cv-contact a:hover { text-decoration: underline; }
  .cv-summary { margin-top: 16px; color: var(--dim); font-size: .95rem; max-width: 68ch; }
  .cv-head .btn-ghost { margin-top: 18px; min-height: 44px; }

  .cv-block { margin-bottom: 34px; }
  .cv-h {
    font-family: var(--f-mono);
    font-size: .72rem;
    letter-spacing: .09em;
    color: var(--signal);
    text-transform: uppercase;
    padding-bottom: 10px;
    margin-bottom: 18px;
    border-bottom: 1px solid var(--rule);
  }
  .cv-job { margin-bottom: 22px; }
  .cv-job-top { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: baseline; }
  .cv-org { font-family: var(--f-display); font-weight: 600; font-size: 1.05rem; }
  .cv-role { color: var(--dim); font-size: .92rem; }
  .cv-when { font-family: var(--f-mono); font-size: .74rem; color: var(--dim-2); }

  function drawWires() {
    var wrap = el("sysmap");
    var svg = el("sysWires");
    if (!wrap || !svg) return;

    if (window.innerWidth <= 760) { svg.innerHTML = ""; return; }

    var wr = wrap.getBoundingClientRect();
    svg.setAttribute("viewBox", "0 0 " + wr.width + " " + wr.height);
    var out = "";

    WORK.forEach(function (w) {
      var pn = wrap.querySelector('.sysnode[data-p="' + w.slug + '"]');
      if (!pn) return;
      var pr = pn.getBoundingClientRect();
      var x1 = pr.right - wr.left;
      var y1 = pr.top + pr.height / 2 - wr.top;

      w.caps.forEach(function (cid) {
        var cn = wrap.querySelector('.syscap[data-c="' + cid + '"]');
        if (!cn) return;
        var cr = cn.getBoundingClientRect();
        var x2 = cr.left - wr.left;
        var y2 = cr.top + cr.height / 2 - wr.top;
        out += '<path class="wire" data-p="' + w.slug + '" data-c="' + cid + '" d="M' + x1.toFixed(1) + ' ' +
          y1.toFixed(1) + ' C ' + (x1 + 46).toFixed(1) + ' ' + y1.toFixed(1) + ', ' +
          (x2 - 46).toFixed(1) + ' ' + y2.toFixed(1) + ', ' + x2.toFixed(1) + ' ' + y2.toFixed(1) + '"></path>';
      });
    });

    svg.innerHTML = out;
    setupMapDraw();
    if (mapSelection) paintMap(mapSelection);
  }

  var mapSelection = null;

  function paintMap(slug) {
    var wrap = el("sysmap");
    if (!wrap) return;
    var state = el("sysState");
    var open = el("sysOpen");

    wrap.classList.toggle("picking", !!slug);
    Array.prototype.forEach.call(wrap.querySelectorAll(".sysnode"), function (n) {
      n.setAttribute("aria-pressed", n.getAttribute("data-p") === slug ? "true" : "false");
    });
    Array.prototype.forEach.call(wrap.querySelectorAll(".wire"), function (l) {
      l.classList.toggle("on", l.getAttribute("data-p") === slug);
    });

    var w = slug ? byWork(slug) : null;
    var lit = {};
    if (w) w.caps.forEach(function (c) { lit[c] = true; });
    Array.prototype.forEach.call(wrap.querySelectorAll(".syscap"), function (c) {
      c.classList.toggle("on", !!lit[c.getAttribute("data-c")]);
    });

    if (state) {
      state.innerHTML = w
        ? '<span class="sel">' + esc(w.org) + '</span> exercised ' + w.caps.length + ' of ' + CAP_ORDER.length + ' capabilities'
        : "Pick a project to trace what it exercised.";
    }
    if (open) {
      if (w) { open.hidden = false; open.setAttribute("href", "#/work/" + w.slug); open.textContent = "Open " + w.org; }
      else open.hidden = true;
    }
  }

  function bindMap() {
    var wrap = el("sysmap");
    if (!wrap) return;
    mapSelection = null;

    var canHover = window.matchMedia("(hover: hover)").matches;

    Array.prototype.forEach.call(wrap.querySelectorAll(".sysnode"), function (node) {
      var slug = node.getAttribute("data-p");

      node.addEventListener("click", function () {
        mapSelection = mapSelection === slug ? null : slug;
        paintMap(mapSelection);
      });

      // pointer preview is a desktop nicety only; the click above is the real control
      if (canHover) {
        node.addEventListener("mouseenter", function () { if (!mapSelection) paintMap(slug); });
        node.addEventListener("mouseleave", function () { if (!mapSelection) paintMap(null); });
      }
      node.addEventListener("focus", function () { if (!mapSelection) paintMap(slug); });
      node.addEventListener("blur", function () { if (!mapSelection) paintMap(null); });
    });

    requestAnimationFrame(drawWires);
  }

  /* =========================================================
     INTRO — scroll zooms through the monitor into the console
     ========================================================= */

  var staticIntro = reduceMotion;

  /* One damped rAF loop drives the intro, parallax, the rail and the
     timeline. Scroll position is smoothed rather than read raw, which is
     what makes the whole thing feel continuous instead of stepped. */
  var M = {
    sy: 0,
    vh: window.innerHeight,
    docH: 1,
    layers: [],
    trace: null,
    started: false
  };

  function clamp01(v) { return v < 0 ? 0 : v > 1 ? 1 : v; }
  function smoothstep(t) { return t * t * (3 - 2 * t); }

  function measure() {
    M.vh = window.innerHeight;
    M.docH = Math.max(document.documentElement.scrollHeight - M.vh, 1);

    M.layers.forEach(function (p) {
      var r = p.el.getBoundingClientRect();
      p.top = r.top + window.scrollY;
      p.h = r.height;
    });

    var trace = document.querySelector(".trace");
    if (trace) {
      var tr = trace.getBoundingClientRect();
      M.trace = {
        fill: trace.querySelector(".trace-fill"),
        top: tr.top + window.scrollY,
        h: tr.height,
        rows: Array.prototype.map.call(trace.querySelectorAll(".trace-row"), function (row) {
          var rr = row.getBoundingClientRect();
          return { el: row, top: rr.top + window.scrollY };
        })
      };
    } else {
      M.trace = null;
    }
  }

  function collectLayers() {
    M.layers = [];
    if (staticIntro) return;
    Array.prototype.forEach.call(document.querySelectorAll("[data-par]"), function (node) {
      node.classList.add("par");
      M.layers.push({ el: node, speed: parseFloat(node.getAttribute("data-par")) || 0.08 });
    });
  }

  function setLayer(id, ty, s) {
    var g = document.getElementById(id);
    if (!g) return;
    g.setAttribute(
      "transform",
      "translate(600 " + (350 + ty).toFixed(1) + ") scale(" + s.toFixed(4) + ") translate(-600 -350)"
    );
  }

  function updateIntro(sy) {
    var stage = el("stage");
    if (!stage || staticIntro) return;
    if (!stage.classList.contains("live")) return;

    var p = clamp01(sy / (M.vh * 1.2));
    var e = smoothstep(p);

    // fly through the screen
    el("stageInner").style.transform = "scale(" + (1 + e * 5.6).toFixed(4) + ")";
    var blur = e < 0.18 ? 0 : (e - 0.18) * 5.4;
    el("stageInner").style.filter = blur > 0.1 ? "blur(" + blur.toFixed(2) + "px)" : "none";
    stage.style.opacity = (p < 0.6 ? 1 : clamp01(1 - (p - 0.6) / 0.4)).toFixed(3);
    stage.style.visibility = p >= 0.999 ? "hidden" : "visible";

    // depth: the person rushes past, the monitor stays the target
    setLayer("layFore", e * 320, 1 + e * 1.15);
    setLayer("layDesk", e * 155, 1 + e * 0.5);
    setLayer("layMid", e * 18, 1 + e * 0.12);
    setLayer("layBack", e * -55, 1 - e * 0.07);

    el("topbar").style.opacity = clamp01((p - 0.52) / 0.33).toFixed(3);
    var cue = el("scrollCue");
    if (cue) cue.style.opacity = clamp01(1 - p * 3.4).toFixed(3);
  }

  function updateTrace(sy) {
    if (!M.trace) return;
    var t = M.trace;
    var start = t.top - M.vh * 0.72;
    var p = clamp01((sy - start) / (t.h + M.vh * 0.25));
    if (t.fill) t.fill.style.height = (p * t.h).toFixed(1) + "px";
    var line = sy + M.vh * 0.72;
    t.rows.forEach(function (r) { r.el.classList.toggle("lit", r.top < line); });
  }

  function frame() {
    var target = window.scrollY;
    M.sy += (target - M.sy) * (staticIntro ? 1 : 0.13);
    if (Math.abs(target - M.sy) < 0.06) M.sy = target;
    var sy = M.sy;

    var rail = el("rail");
    if (rail) rail.style.transform = "scaleX(" + (sy / M.docH).toFixed(4) + ")";

    updateIntro(sy);
    updateTrace(sy);

    // layered parallax across sections
    var center = sy + M.vh / 2;
    for (var i = 0; i < M.layers.length; i++) {
      var p = M.layers[i];
      var rel = (center - (p.top + p.h / 2)) / M.vh;
      if (rel < -1.8 || rel > 1.8) continue;
      p.el.style.transform = "translate3d(0," + (rel * p.speed * 100).toFixed(2) + "px,0)";
    }

    requestAnimationFrame(frame);
  }

  /* ---------- reveals ---------- */

  var revealIO = null;
  var seenIO = null;

  function setupReveals() {
    if (revealIO) revealIO.disconnect();
    if (seenIO) seenIO.disconnect();

    var sections = document.querySelectorAll("section");
    seenIO = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) {
        if (en.isIntersecting) en.target.classList.add("seen");
      });
    }, { threshold: 0.12 });
    Array.prototype.forEach.call(sections, function (s) { seenIO.observe(s); });

    var items = document.querySelectorAll(".rv");
    if (staticIntro) {
      Array.prototype.forEach.call(items, function (n) { n.classList.add("in"); });
      return;
    }

    revealIO = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) {
        if (!en.isIntersecting) return;
        en.target.classList.add("in");
        revealIO.unobserve(en.target);
      });
    }, { rootMargin: "0px 0px -6% 0px", threshold: 0.05 });

    Array.prototype.forEach.call(items, function (n) {
      // anything already on screen shows immediately — the first frame is never blank
      if (n.getBoundingClientRect().top < window.innerHeight * 0.96) {
        n.classList.add("instant", "in");
      } else {
        revealIO.observe(n);
      }
    });
  }

  /* ---------- map: draw the links in ---------- */

  function setupMapDraw() {
    var svg = el("sysWires");
    var shell = el("sysmap");
    if (!svg || !shell) return;

    var wires = svg.querySelectorAll(".wire");
    if (!wires.length) return;

    Array.prototype.forEach.call(wires, function (l, i) {
      var len = 640;
      try { len = Math.ceil(l.getTotalLength()); } catch (e) { /* not measurable yet */ }
      l.style.setProperty("--len", len);
      l.style.setProperty("--d", i);
    });

    if (staticIntro) { svg.classList.add("drawn"); return; }

    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) {
        if (!en.isIntersecting) return;
        svg.classList.add("drawn");
        io.disconnect();
      });
    }, { threshold: 0.15 });
    io.observe(shell);
  }

  /* ---------- pointer-tracked tilt ---------- */

  function bindTilt() {
    if (staticIntro) return;
    Array.prototype.forEach.call(document.querySelectorAll(".tilt"), function (node) {
      node.addEventListener("pointermove", function (ev) {
        if (ev.pointerType === "touch") return;
        var r = node.getBoundingClientRect();
        var dx = (ev.clientX - r.left) / r.width - 0.5;
        var dy = (ev.clientY - r.top) / r.height - 0.5;
        node.classList.add("tracking");
        node.style.transform =
          "perspective(1100px) rotateX(" + (-dy * 2.4).toFixed(2) + "deg) rotateY(" + (dx * 3.2).toFixed(2) + "deg)";
      });
      node.addEventListener("pointerleave", function () {
        node.classList.remove("tracking");
        node.style.transform = "";
      });
    });
  }

  function motionRoute(isHome) {
    var stage = el("stage");
    if (!staticIntro && isHome) {
      stage.style.opacity = "1";
      stage.style.visibility = "visible";
      el("stageInner").style.transform = "scale(1)";
      el("stageInner").style.filter = "none";
      el("topbar").style.opacity = "0";
      M.sy = 0;
    } else {
      stage.style.opacity = "";
      el("stageInner").style.transform = "";
      el("stageInner").style.filter = "";
      el("topbar").style.opacity = "";
    }

    collectLayers();
    setupReveals();
    setupMapDraw();
    bindTilt();
    requestAnimationFrame(function () { measure(); });

    if (!M.started) { M.started = true; requestAnimationFrame(frame); }
  }

  function typeScreen() {
    var nameNode = el("scName");
    var tagNode = el("scTag");
    var caret = el("scCaret");
    if (!nameNode || !tagNode) return;

    var NAME = "Avinash";
    var TAG = "a Metacognist & Philomath";

    // Deep-linked to an inner route: the scene is hidden, so measuring text would fail.
    if (staticIntro || !el("stage").classList.contains("live")) {
      nameNode.textContent = NAME;
      tagNode.textContent = TAG;
      if (caret) caret.setAttribute("x", "379");
      return;
    }

    var i = 0, j = 0;
    caret.style.display = "none";

    var t1 = setInterval(function () {
      i++;
      nameNode.textContent = NAME.slice(0, i);
      if (i >= NAME.length) {
        clearInterval(t1);
        caret.style.display = "";
        setTimeout(function () {
          var t2 = setInterval(function () {
            j++;
            tagNode.textContent = TAG.slice(0, j);
            try {
              caret.setAttribute("x", String(379 + tagNode.getComputedTextLength() + 4));
            } catch (e) { /* text not measurable yet */ }
            if (j >= TAG.length) clearInterval(t2);
          }, 34);
        }, 260);
      }
    }, 90);
  }

  /* =========================================================
     LOAD SEQUENCE — one orchestrated moment, home only
     ========================================================= */

  var bootDone = false;
  function bootLine() {
    var node = el("consoleLine");
    if (!node) return;
    var full = 'pipeline ready — <b>6 stages online</b>, latency budget loaded';
    if (reduceMotion || bootDone) {
      node.innerHTML = full;
      return;
    }
    bootDone = true;
    var plain = "pipeline ready — 6 stages online, latency budget loaded";
    var i = 0;
    node.innerHTML = '<span class="caret"></span>';
    var timer = setInterval(function () {
      i++;
      node.innerHTML = esc(plain.slice(0, i)) + '<span class="caret"></span>';
      if (i >= plain.length) {
        clearInterval(timer);
        setTimeout(function () { node.innerHTML = full; }, 420);
      }
    }, 18);
  }

  var countIO = null;

  function runCount(n) {
    var m = n.textContent.trim().match(/^(\d+)(.*)$/);
    if (!m) return;
    var target = parseInt(m[1], 10);
    var suffix = m[2];
    if (target < 2) return;

    var start = performance.now();
    var dur = 900;
    n.textContent = "0" + suffix;
    (function tick(now) {
      var p = Math.min((now - start) / dur, 1);
      var eased = 1 - Math.pow(1 - p, 4);
      n.textContent = Math.round(target * eased) + suffix;
      if (p < 1) requestAnimationFrame(tick);
      else n.textContent = target + suffix;
    })(start);
  }

  function countUp() {
    if (reduceMotion) return;
    if (countIO) countIO.disconnect();

    var nodes = document.querySelectorAll(".ro .v");
    countIO = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) {
        if (!en.isIntersecting) return;
        runCount(en.target);
        en.target.closest(".ro").classList.add("hot");
        countIO.unobserve(en.target);
      });
    }, { threshold: 0.55 });

    Array.prototype.forEach.call(nodes, function (n) { countIO.observe(n); });
  }

  /* =========================================================
     MENU DRAWER — reaches every page at any screen size
     ========================================================= */

  function renderMenu() {
    el("navBody").innerHTML = MENU.map(function (g) {
      var items = g.items.map(function (i) {
        return '<a class="drawer-link" href="' + i.path + '">' +
          '<span class="dl-name">' + esc(i.label) + '</span>' +
          '<span class="dl-note">' + esc(i.note) + '</span>' +
        '</a>';
      }).join("");
      return '<div class="drawer-group"><div class="drawer-group-name">' + esc(g.group) + '</div></div>' + items;
    }).join("");
  }

  var menuOpen = false;
  var lastFocus = null;

  function openMenu() {
    if (menuOpen) return;
    menuOpen = true;
    lastFocus = document.activeElement;
    el("navScrim").hidden = false;
    var d = el("navDrawer");
    d.setAttribute("aria-hidden", "false");
    // next frame so the transition runs from the closed position
    requestAnimationFrame(function () { d.classList.add("open"); });
    el("navToggle").setAttribute("aria-expanded", "true");
    document.body.classList.add("menu-open");
    el("navClose").focus();
  }

  function closeMenu() {
    if (!menuOpen) return;
    menuOpen = false;
    var d = el("navDrawer");
    d.classList.remove("open");
    d.setAttribute("aria-hidden", "true");
    el("navScrim").hidden = true;
    el("navToggle").setAttribute("aria-expanded", "false");
    document.body.classList.remove("menu-open");
    if (lastFocus && lastFocus.focus) lastFocus.focus();
  }

  /* =========================================================
     COMMAND PALETTE
     ========================================================= */

  var palIndex = 0;
  var palMatches = COMMANDS.slice();

  function palRender() {
    var list = el("paletteList");
    if (!palMatches.length) {
      list.innerHTML = '<li class="palette-empty">No section matches that.</li>';
      return;
    }
    list.innerHTML = palMatches.map(function (c, i) {
      return '<li data-active="' + (i === palIndex ? "true" : "false") + '">' +
        '<a href="' + c.path + '"><span>' + esc(c.label) + '</span>' +
        '<span class="p-path">' + esc(c.path) + '</span></a></li>';
    }).join("");
  }

  function palOpen() {
    el("paletteScrim").classList.add("open");
    var input = el("paletteInput");
    input.value = "";
    palMatches = COMMANDS.slice();
    palIndex = 0;
    palRender();
    input.focus();
  }
  function palClose() {
    el("paletteScrim").classList.remove("open");
  }
  function palFilter(q) {
    q = q.trim().toLowerCase();
    palMatches = q
      ? COMMANDS.filter(function (c) { return (c.label + " " + c.path).toLowerCase().indexOf(q) !== -1; })
      : COMMANDS.slice();
    palIndex = 0;
    palRender();
  }
  function palGo() {
    if (!palMatches.length) return;
    window.location.hash = palMatches[palIndex].path;
    palClose();
  }

  /* =========================================================
     BOOT
     ========================================================= */

  el("nav").innerHTML = NAV.map(function (n) {
    return '<a href="' + n.path + '">' + esc(n.label) + '</a>';
  }).join("");

  renderMenu();
  el("navToggle").addEventListener("click", function () { menuOpen ? closeMenu() : openMenu(); });
  el("navClose").addEventListener("click", closeMenu);
  el("navScrim").addEventListener("click", closeMenu);

  el("paletteBtn").addEventListener("click", palOpen);
  el("paletteScrim").addEventListener("click", function (e) {
    if (e.target === el("paletteScrim")) palClose();
  });
  el("paletteInput").addEventListener("input", function (e) { palFilter(e.target.value); });
  el("paletteList").addEventListener("mousemove", function (e) {
    var li = e.target.closest("li");
    if (!li || !li.parentNode) return;
    var idx = Array.prototype.indexOf.call(el("paletteList").children, li);
    if (idx >= 0 && idx !== palIndex) { palIndex = idx; palRender(); }
  });
  el("paletteList").addEventListener("click", function () { setTimeout(palClose, 0); });

  document.addEventListener("keydown", function (e) {
    var open = el("paletteScrim").classList.contains("open");
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") {
      e.preventDefault();
      open ? palClose() : palOpen();
      return;
    }
    if (e.key === "Escape" && menuOpen) { e.preventDefault(); closeMenu(); return; }
    if (!open) return;
    if (e.key === "Escape") { e.preventDefault(); palClose(); }
    else if (e.key === "ArrowDown") { e.preventDefault(); palIndex = Math.min(palIndex + 1, palMatches.length - 1); palRender(); }
    else if (e.key === "ArrowUp") { e.preventDefault(); palIndex = Math.max(palIndex - 1, 0); palRender(); }
    else if (e.key === "Enter") { e.preventDefault(); palGo(); }
  });

  var motionOn = !reduceMotion;
  el("motionBtn").textContent = motionOn ? "motion on" : "motion off";
  el("motionBtn").setAttribute("aria-pressed", motionOn ? "true" : "false");
  el("motionBtn").addEventListener("click", function () {

    this.setAttribute("aria-pressed", motionOn ? "true" : "false");

    if (lab) {

      var pb = el("labPause");

  function clock() {
    var d = new Date();

      String(d.getHours()).padStart(2, "0") + ":" +
      String(d.getMinutes()).padStart(2, "0") + ":" +
      String(d.getSeconds()).padStart(2, "0");

  clock();
  setInterval(clock, 1000);

  if (staticIntro) document.body.classList.add("static-intro");

  if (!staticIntro) document.body.classList.add("anim");

  el("scrollCue").addEventListener("click", function () {

  // On a phone the full desk is too small to read, so frame the monitor instead.
  function fitScene() {
    var svg = document.querySelector(".scene");
    if (!svg) return;
    var w = window.innerWidth;
    if (w <= 560) svg.setAttribute("viewBox", "300 96 600 470");
    else if (w <= 860) svg.setAttribute("viewBox", "170 80 860 560");
    else svg.setAttribute("viewBox", "0 0 1200 700");
  }

  // Delegated so it survives every re-render.
  el("view").addEventListener("click", function (ev) {
    if (ev.target && ev.target.id === "printCv") window.print();
  });

  var resizeTimer = null;
  window.addEventListener("resize", function () {
    fitScene();
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () { measure(); drawWires(); }, 140);
  });

  // late assets (fonts) change geometry, so re-measure once settled
  window.addEventListener("load", function () {
    setTimeout(function () { measure(); drawWires(); }, 60);
  });

  fitScene();

  window.addEventListener("hashchange", render);
  renderFooter();
  render();
  typeScreen();
})();
</script>

</body>
</html>
